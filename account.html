.nav-btn{

    height:52px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:17px;

.active-nav{
    background:#2d173d;
    border:1px solid #75468f;
    box-shadow:0 0 16px #913cff35;

</head>

<body>

<div class="header">

    <div class="profile-logo">
        👤
    </div>

    <div class="title">
        PROFILE
    </div>

    <div class="active">
        ● ACTIVE
    </div>

</div>


<div class="container">

    <div class="section-title">
        ACCOUNT INFORMATION
    </div>


    <div class="info-button purple">
        <div>
            👤 USER ID
        </div>

        <span id="userId">
            Creating...
        </span>
    </div>


    <div class="info-button gold">
        <div>

        </div>

        <span id="rank">
            🥉 BRONZE
        </span>
    </div>


    <div class="info-button red">
        <div>
            📦 TOTAL ORDERS
        </div>

        <span id="totalOrders">
            0
        </span>
    </div>


    <div class="info-button gold">
        <div>
            💰 TOTAL DEPOSIT
        </div>

        <span id="totalDeposit">
            ৳0
        </span>
    </div>


    <div class="info-button purple">
        <div>
            👥 TOTAL USERS
        </div>

        <span>
            100,397
        </span>
    </div>


    <div class="info-button purple">
        <div>

        </div>

            Crazy Like Shop
        </span>

    </div>

</div>


<div class="bottom-nav">

    <a class="nav-btn" href="index.html">
        🏠

    <a class="nav-btn" href="orders.html">
        🧾
    </a>

    <a class="nav-btn" href="shop.html">

    </a>

    <a class="nav-btn" href="deposit.html">

    <a class="nav-btn active-nav" href="account.html">
        👤
    </a>

</div>


<script>

/* ==========================================
   TELEGRAM MINI APP
========================================== */

let telegramUserId = "";

try{

    if(
        window.Telegram &&
        window.Telegram.WebApp
    ){

        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        const user =
            Telegram.WebApp.initDataUnsafe &&
            Telegram.WebApp.initDataUnsafe.user;

        if(user && user.id){

            telegramUserId =
                String(user.id);

        }

    }

}catch(error){

    console.log(error);

}


/* ==========================================
   FIREBASE
========================================== */

const FIREBASE_URL =
    "https://crazy-like-shop-default-rtdb.firebaseio.com";


/* ==========================================
   CREATE CRAZY ID
========================================== */

function createCrazyId(){

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code = "";

    for(let i = 0; i < 6; i++){

        const randomIndex =
            Math.floor(
                Math.random() * chars.length
            );

        code += chars[randomIndex];

    }

    return "CRAZY_" + code;

}


/* ==========================================
   LOAD / CREATE USER
========================================== */

async function loadUser(){

    if(!telegramUserId){

        document.getElementById(
            "status"
        ).textContent =
            "❌ Telegram account not detected";

        return;
    }


    try{

        const userPath =
            encodeURIComponent(
                telegramUserId
            );


        const getUrl =
            FIREBASE_URL +
            "/users/" +
            userPath +
            ".json";


        /* GET USER */

        const response =
            await fetch(getUrl);


        if(!response.ok){

            throw new Error(
                "Firebase read failed"
            );

        }


        const oldUser =
            await response.json();


        /* ==================================
           EXISTING USER
        ================================== */

        if(oldUser){

            document.getElementById(
                "userId"
            ).textContent =
                oldUser.crazy_id || "UNKNOWN";


            document.getElementById(
                "totalDeposit"
            ).textContent =
                "৳" +
                Number(
                    oldUser.total_deposit || 0
                );


            document.getElementById(
                "totalOrders"
            ).textContent =
                Number(
                    oldUser.total_orders || 0
                );


            setRank(
                Number(
                    oldUser.total_deposit || 0
                )
            );


            document.getElementById(
                "status"
            ).textContent =
                "Account loaded ✓";


            return;
        }


        /* ==================================
           NEW USER
        ================================== */

        const newCrazyId =
            createCrazyId();


        const newUser = {

            crazy_id:
                newCrazyId,

            balance:
                0,

            total_deposit:
                0,

            total_orders:
                0,

            created_at:
                new Date().toISOString()

        };


        /* SAVE USER */

        const saveResponse =
            await fetch(
                getUrl,
                {
                    method:"PUT",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            newUser
                        )
                }
            );


        if(!saveResponse.ok){

            throw new Error(
                "Firebase write failed"
            );

        }


        document.getElementById(
            "userId"
        ).textContent =
            newCrazyId;


        document.getElementById(
            "totalDeposit"
        ).textContent =
            "৳0";


        document.getElementById(
            "totalOrders"
        ).textContent =
            "0";


        setRank(0);


        document.getElementById(
            "status"
        ).textContent =
            "New account created ✓";

    }

    catch(error){

        console.log(error);

        document.getElementById(
            "status"
        ).textContent =
            "❌ Firebase connection/error";

    }

}


/* ==========================================
   RANK
========================================== */

function setRank(totalDeposit){

    let rank =
        "🥉 BRONZE";


    if(totalDeposit >= 10000000000){

        rank =
            "👑 MASTER";

    }

    else if(totalDeposit >= 10000){

        rank =
            "🔴 HEROIC";

    }

    else if(totalDeposit >= 1000){

        rank =
            "💎 DIAMOND";

    }

    else if(totalDeposit >= 500){

        rank =
            "🥈 SILVER";

    }

    else if(totalDeposit >= 100){

        rank =
            "🥉 BRONZE";

    }


    document.getElementById(
        "rank"
    ).textContent =
        rank;

}


/* ==========================================
   START
========================================== */

loadUser();

</script>

</body>
