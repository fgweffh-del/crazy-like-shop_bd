<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Crazy Like Profile</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    color:#fff;

    background:
        radial-gradient(
            circle at 50% 0%,
            #8b2cff35,
            transparent 35%
        ),
        #050507;

    padding-bottom:95px;
}

.container{
    width:100%;
    max-width:620px;
    margin:auto;

    padding:25px 15px 30px;
}


/* =========================
   PROFILE
========================= */

.profile{
    text-align:center;
    padding-bottom:22px;
}

.profile-logo{
    width:82px;
    height:82px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #7b2db0,
            #24102f
        );

    border:2px solid #a65bd2;

    box-shadow:
        0 0 15px #9b32ff,
        0 0 35px #9b32ff55;

    font-size:40px;
}

.profile-title{
    margin-top:10px;

    font-size:24px;
    font-weight:900;
    letter-spacing:1px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #c879ff,
            #ffd45b
        );

    -webkit-background-clip:text;
    color:transparent;
}

.active{
    margin-top:7px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:6px;

    color:#57ef96;

    font-size:9px;
    font-weight:bold;
}

.active-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#57ef96;

    box-shadow:
        0 0 10px #57ef96;
}


/* =========================
   BUTTON AREA
========================= */

.buttons{
    display:flex;
    flex-direction:column;
    gap:13px;
}


/* COMMON BUTTON */

.info-button{

    width:100%;
    min-height:62px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    border-radius:17px;

    background:
        linear-gradient(
            145deg,
            #151018,
            #09080c
        );

    color:#fff;

    font-size:11px;
    font-weight:bold;

    border:1px solid;

    transition:.2s;
}

.info-button:active{
    transform:scale(.97);
}


/* LEFT */

.button-left{
    display:flex;
    align-items:center;
    gap:9px;

    min-width:0;
}

.button-icon{
    font-size:20px;
}

.button-label{
    color:#b5aabc;
}


/* RIGHT */

.button-right{
    text-align:right;

    font-size:12px;
    font-weight:900;

    white-space:nowrap;
}


/* =========================
   PURPLE
========================= */

.purple{

    border-color:#8e38bd;

    box-shadow:
        0 0 10px #9b32ff55,
        inset 0 0 15px #9b32ff0d;
}

.purple .button-right{
    color:#d18aff;
}


/* =========================
   GOLD
========================= */

.gold{

    border-color:#c69227;

    box-shadow:
        0 0 10px #ffd21f55,
        inset 0 0 15px #ffd21f0d;
}

.gold .button-right{
    color:#ffd45b;
}


/* =========================
   RED
========================= */

.red{

    border-color:#a52c35;

    box-shadow:
        0 0 10px #ff263855,
        inset 0 0 15px #ff26380d;
}

.red .button-right{
    color:#ff6670;
}


/* =========================
   INFO BUTTON
========================= */

.info-button.info{

    display:block;

    padding:16px 18px;

    border-color:#8e38bd;

    box-shadow:
        0 0 13px #9b32ff55,
        inset 0 0 18px #9b32ff0d;
}

.info-top{

    display:flex;
    align-items:center;

    gap:9px;

    color:#d18aff;

    font-size:12px;
    font-weight:900;
}

.info-text{

    margin-top:10px;

    color:#96909e;

    font-size:10px;

    line-height:1.6;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{

    position:fixed;

    left:50%;
    bottom:10px;

    transform:translateX(-50%);

    width:calc(100% - 20px);
    max-width:600px;

    height:68px;

    display:flex;
    align-items:center;
    justify-content:space-around;

    padding:6px;

    background:
        linear-gradient(
            145deg,
            #19111f,
            #09080d
        );

    border:1px solid #3c2948;

    border-radius:22px;

    box-shadow:
        0 10px 35px #000,
        0 0 20px #8b32d522;

    z-index:999;
}

.nav-btn{

    width:52px;
    height:52px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:0;

    border-radius:17px;

    background:transparent;

    font-size:24px;

    cursor:pointer;

    transition:.2s;
}

.nav-btn:active{
    transform:scale(.86);
}

.nav-btn.active{

    background:
        linear-gradient(
            145deg,
            #48245c,
            #21112d
        );

    border:1px solid #8549a6;

    box-shadow:
        0 0 15px #9b32ff55;
}

</style>
</head>


<body>


<div class="container">


    <!-- PROFILE -->

    <div class="profile">

        <div class="profile-logo">
            👤
        </div>

        <div class="profile-title">
            PROFILE
        </div>

        <div class="active">

            <span class="active-dot"></span>

            ACTIVE

        </div>

    </div>


    <!-- BUTTONS -->

    <div class="buttons">


        <!-- USER ID -->

        <div class="info-button purple">

            <div class="button-left">

                <span class="button-icon">
                    👤
                </span>

                <span class="button-label">
                    USER ID
                </span>

            </div>

            <div
                class="button-right"
                id="userId">

                000000

            </div>

        </div>


        <!-- CURRENT RANK -->

        <div class="info-button gold">

            <div class="button-left">

                <span class="button-icon">
                    🥉
                </span>

                <span class="button-label">
                    CURRENT RANK
                </span>

            </div>

            <div
                class="button-right"
                id="rank">

                BRONZE

            </div>

        </div>


        <!-- TOTAL ORDERS -->

        <div class="info-button red">

            <div class="button-left">

                <span class="button-icon">
                    📦
                </span>

                <span class="button-label">
                    TOTAL ORDERS
                </span>

            </div>

            <div
                class="button-right"
                id="totalOrders">

                0

            </div>

        </div>


        <!-- TOTAL DEPOSIT -->

        <div class="info-button gold">

            <div class="button-left">

                <span class="button-icon">
                    💰
                </span>

                <span class="button-label">
                    TOTAL DEPOSIT
                </span>

            </div>

            <div
                class="button-right"
                id="totalDeposit">

                ৳0

            </div>

        </div>


        <!-- TOTAL USERS -->

        <div class="info-button purple">

            <div class="button-left">

                <span class="button-icon">
                    👥
                </span>

                <span class="button-label">
                    TOTAL USERS
                </span>

            </div>

            <div class="button-right">

                100,397

            </div>

        </div>


        <!-- INFO -->

        <div class="info-button info">

            <div class="info-top">

                ℹ️ INFO

            </div>

            <div
                class="info-text"
                id="adminInfo">

                Admin Panel থেকে Info এখানে দেখানো হবে।

            </div>

        </div>


    </div>

</div>


<!-- BOTTOM NAV -->

<div class="bottom-nav">

    <button
        class="nav-btn"
        onclick="location.href='index.html'">

        🏠

    </button>


    <button
        class="nav-btn"
        onclick="location.href='orders.html'">

        🧾

    </button>


    <button
        class="nav-btn"
        onclick="location.href='shop.html'">

        🛒

    </button>


    <button
        class="nav-btn"
        onclick="location.href='deposit.html'">

        💳

    </button>


    <button
        class="nav-btn active"
        onclick="location.href='account.html'">

        👤

    </button>

</div>


<script>

/* Telegram */

if(
    window.Telegram &&
    window.Telegram.WebApp
){

    Telegram.WebApp.ready();

    Telegram.WebApp.expand();

}


/* Demo data */

let totalDeposit = 0;

let totalOrders = 0;


/* Rank */

function updateRank(){

    let rank = "BRONZE";

    if(totalDeposit >= 10000000000){

        rank = "👑 MASTER";

    }

    else if(totalDeposit >= 10000){

        rank = "🔴 HEROIC";

    }

    else if(totalDeposit >= 1000){

        rank = "💎 DIAMOND";

    }

    else if(totalDeposit >= 500){

        rank = "🥈 SILVER";

    }

    else{

        rank = "🥉 BRONZE";

    }


    document.getElementById("rank").innerText = rank;

    document.getElementById("totalDeposit").innerText =
        "৳" + totalDeposit.toLocaleString();

    document.getElementById("totalOrders").innerText =
        totalOrders.toLocaleString();

}


updateRank();

</script>


</body>
  </html>
