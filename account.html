<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crazy Like Shop - Account</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#050507;
    color:white;
    font-family:Arial,sans-serif;
    min-height:100vh;
    padding-bottom:90px;
}

.header{
    text-align:center;
    padding:28px 15px 20px;
}

.profile-logo{
    width:82px;
    height:82px;
    margin:auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    background:linear-gradient(145deg,#1a1025,#09090c);
    border:2px solid #b56cff;
    box-shadow:
        0 0 15px #9b35ff,
        0 0 35px rgba(155,53,255,.45);
}

.title{
    margin-top:12px;
    font-size:25px;
    font-weight:bold;
    color:#d59cff;
    text-shadow:0 0 12px #9b35ff;
}

.active{
    display:inline-block;
    margin-top:8px;
    padding:6px 18px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    color:#72ff8b;
    border:1px solid #39ff68;
    box-shadow:0 0 12px rgba(57,255,104,.5);
}

.container{
    width:92%;
    max-width:600px;
    margin:auto;
}

.info-button{
    width:100%;
    min-height:68px;
    margin:13px 0;
    padding:16px 18px;
    border-radius:16px;
    background:#0b0b10;
    border:1px solid;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    font-size:15px;
    font-weight:bold;
    box-shadow:0 0 15px rgba(0,0,0,.6);
}

.info-button span{
    text-align:right;
    word-break:break-word;
}

.purple{
    border-color:#a43cff;
    box-shadow:
        0 0 10px rgba(164,60,255,.5),
        inset 0 0 15px rgba(164,60,255,.08);
}

.purple span{
    color:#c98cff;
}

.gold{
    border-color:#ffd23f;
    box-shadow:
        0 0 10px rgba(255,210,63,.45),
        inset 0 0 15px rgba(255,210,63,.08);
}

.gold span{
    color:#ffd84d;
}

.red{
    border-color:#ff3d4f;
    box-shadow:
        0 0 10px rgba(255,61,79,.45),
        inset 0 0 15px rgba(255,61,79,.08);
}

.red span{
    color:#ff6573;
}

.section-title{
    margin:25px 0 8px;
    color:#777;
    font-size:12px;
    letter-spacing:2px;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:72px;
    background:#08080c;
    border-top:1px solid #29202f;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:999;
}

.nav-btn{
    text-decoration:none;
    font-size:26px;
    width:20%;
    height:58px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:14px;
}

.nav-btn.active-nav{
    background:rgba(164,60,255,.13);
    box-shadow:0 0 15px rgba(164,60,255,.35);
}

.error{
    text-align:center;
    color:#ff6573;
    margin-top:15px;
    font-size:13px;
}
</style>
</head>

<body>

<div class="header">

    <div class="profile-logo">
        👤
    </div>

    <div class="title">
        PROFILE
    </div>

    <div class="active">
        ● ACTIVE
    </div>

</div>


<div class="container">

    <div class="section-title">
        ACCOUNT INFORMATION
    </div>

    <!-- USER ID -->
    <div class="info-button purple">
        <div>👤 USER ID</div>
        <span id="userId">Loading...</span>
    </div>


    <!-- CURRENT RANK -->
    <div class="info-button gold">
        <div>🏆 CURRENT RANK</div>
        <span id="rank">🥉 BRONZE</span>
    </div>


    <!-- TOTAL ORDERS -->
    <div class="info-button red">
        <div>📦 TOTAL ORDERS</div>
        <span id="totalOrders">0</span>
    </div>


    <!-- TOTAL DEPOSIT -->
    <div class="info-button gold">
        <div>💰 TOTAL DEPOSIT</div>
        <span id="totalDeposit">৳0</span>
    </div>


    <!-- TOTAL USERS -->
    <div class="info-button purple">
        <div>👥 TOTAL USERS</div>
        <span>100,397</span>
    </div>


    <!-- INFO -->
    <div class="info-button purple">
        <div>ℹ️ INFO</div>
        <span>Crazy Like Shop</span>
    </div>

</div>


<div id="error" class="error"></div>


<!-- BOTTOM NAV -->
<div class="bottom-nav">

    <a class="nav-btn" href="index.html">
        🏠
    </a>

    <a class="nav-btn" href="orders.html">
        🧾
    </a>

    <a class="nav-btn" href="shop.html">
        🛒
    </a>

    <a class="nav-btn" href="deposit.html">
        💳
    </a>

    <a class="nav-btn active-nav" href="account.html">
        👤
    </a>

</div>


<script>

let tg = null;

if(window.Telegram && window.Telegram.WebApp){

    tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    try{

        let user = tg.initDataUnsafe.user;

        if(user && user.id){

            document.getElementById("userId").textContent =
                user.id;

        }else{

            document.getElementById("userId").textContent =
                "Not Available";

            document.getElementById("error").textContent =
                "Telegram User ID পাওয়া যায়নি। Telegram Mini App থেকে খুলুন.";

        }

    }catch(e){

        document.getElementById("userId").textContent =
            "Not Available";

    }

}else{

    document.getElementById("userId").textContent =
        "Telegram Only";

}


/* DEMO DATA */

let totalDeposit = 0;
let totalOrders = 0;


/* TOTAL ORDERS */

document.getElementById("totalOrders").textContent =
    totalOrders;


/* TOTAL DEPOSIT */

document.getElementById("totalDeposit").textContent =
    "৳" + totalDeposit;


/* RANK SYSTEM */

let rank = "🥉 BRONZE";

if(totalDeposit >= 10000000000){

    rank = "👑 MASTER";

}else if(totalDeposit >= 10000){

    rank = "🔴 HEROIC";

}else if(totalDeposit >= 1000){

    rank = "💎 DIAMOND";

}else if(totalDeposit >= 500){

    rank = "🥈 SILVER";

}else{

    rank = "🥉 BRONZE";

}

document.getElementById("rank").textContent = rank;

</script>

</body>
    </html>
