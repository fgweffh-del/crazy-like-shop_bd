<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>Crazy Like Shop - Account</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#050507;
    color:#fff;
    font-family:Arial,sans-serif;
    min-height:100vh;
    padding-bottom:90px;
}

/* =========================
   HEADER
========================= */

.header{
    text-align:center;
    padding:28px 15px 20px;
}

.profile-logo{
    width:82px;
    height:82px;
    margin:auto;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:42px;

    background:#0b0910;

    border:2px solid #b45cff;

    box-shadow:
        0 0 20px #8b2cff,
        0 0 40px #8b2cff44;
}

.title{
    margin-top:12px;

    font-size:25px;
    font-weight:bold;

    color:#d59cff;

    text-shadow:
        0 0 12px #9b35ff;
}

.active{
    display:inline-block;

    margin-top:8px;

    padding:6px 18px;

    border-radius:20px;

    font-size:12px;
    font-weight:bold;

    color:#70ff8a;

    border:1px solid #39ff68;

    box-shadow:
        0 0 12px rgba(57,255,104,.5);
}


/* =========================
   CONTAINER
========================= */

.container{
    width:92%;
    max-width:600px;

    margin:auto;
}

.section-title{
    margin:25px 0 8px;

    color:#777;

    font-size:12px;

    letter-spacing:2px;
}


/* =========================
   INFO BUTTON
========================= */

.info-button{

    width:100%;

    min-height:68px;

    margin:13px 0;

    padding:16px 18px;

    border-radius:16px;

    background:#0b0b10;

    border:1px solid;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    font-size:15px;

    font-weight:bold;
}

.info-button span{

    text-align:right;

    word-break:break-all;

}


/* =========================
   PURPLE
========================= */

.purple{

    border-color:#a43cff;

    box-shadow:
        0 0 12px rgba(164,60,255,.5);
}

.purple span{

    color:#c98cff;
}


/* =========================
   GOLD
========================= */

.gold{

    border-color:#ffd23f;

    box-shadow:
        0 0 12px rgba(255,210,63,.45);
}

.gold span{

    color:#ffd84d;
}


/* =========================
   RED
========================= */

.red{

    border-color:#ff3d4f;

    box-shadow:
        0 0 12px rgba(255,61,79,.45);
}

.red span{

    color:#ff6573;
}


/* =========================
   ERROR
========================= */

.error{

    text-align:center;

    margin:15px;

    color:#ff6573;

    font-size:12px;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{

    position:fixed;

    bottom:10px;

    left:50%;

    transform:translateX(-50%);

    width:calc(100% - 22px);

    max-width:598px;

    height:67px;

    display:flex;

    align-items:center;

    justify-content:space-around;

    padding:6px;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            #18121f,
            #0c0b10
        );

    border:1px solid #3a2d47;

    box-shadow:
        0 10px 35px #000,
        0 0 25px #7d32b518;

    z-index:999;
}

.nav-btn{

    width:52px;

    height:52px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:17px;

    text-decoration:none;

    font-size:24px;
}

.active-nav{

    background:#2d173d;

    border:1px solid #75468f;

    box-shadow:
        0 0 16px #913cff35;
}

</style>

</head>


<body>


<!-- =========================
     PROFILE HEADER
========================= -->

<div class="header">

    <div class="profile-logo">
        👤
    </div>

    <div class="title">
        PROFILE
    </div>

    <div class="active">
        ● ACTIVE
    </div>

</div>


<!-- =========================
     ACCOUNT INFORMATION
========================= -->

<div class="container">

    <div class="section-title">
        ACCOUNT INFORMATION
    </div>


    <!-- USER ID -->

    <div class="info-button purple">

        <div>
            👤 USER ID
        </div>

        <span id="userId">
            Loading...
        </span>

    </div>


    <!-- RANK -->

    <div class="info-button gold">

        <div>
            🏆 CURRENT RANK
        </div>

        <span id="rank">
            🥉 BRONZE
        </span>

    </div>


    <!-- ORDERS -->

    <div class="info-button red">

        <div>
            📦 TOTAL ORDERS
        </div>

        <span id="totalOrders">
            0
        </span>

    </div>


    <!-- DEPOSIT -->

    <div class="info-button gold">

        <div>
            💰 TOTAL DEPOSIT
        </div>

        <span id="totalDeposit">
            ৳0
        </span>

    </div>


    <!-- TOTAL USERS -->

    <div class="info-button purple">

        <div>
            👥 TOTAL USERS
        </div>

        <span>
            100,397
        </span>

    </div>


    <!-- INFO -->

    <div class="info-button purple">

        <div>
            ℹ️ INFO
        </div>

        <span>
            Crazy Like Shop
        </span>

    </div>

</div>


<div id="error"
     class="error">
</div>


<!-- =========================
     BOTTOM NAV
========================= -->

<div class="bottom-nav">

    <a
        class="nav-btn"
        id="homeBtn"
        href="index.html"
    >
        🏠
    </a>


    <a
        class="nav-btn"
        id="ordersBtn"
        href="orders.html"
    >
        🧾
    </a>


    <a
        class="nav-btn"
        id="shopBtn"
        href="shop.html"
    >
        🛒
    </a>


    <a
        class="nav-btn"
        id="depositBtn"
        href="deposit.html"
    >
        💳
    </a>


    <a
        class="nav-btn active-nav"
        href="account.html"
    >
        👤
    </a>

</div>


<script>

/* ==========================================
   TELEGRAM MINI APP
========================================== */

let telegramId = "";

let tg = null;


try{

    if(
        window.Telegram &&
        window.Telegram.WebApp
    ){

        tg =
            window.Telegram.WebApp;

        tg.ready();

        tg.expand();


        /*
         * Telegram Mini App থেকে
         * আসল Telegram User ID
         */

        if(
            tg.initDataUnsafe &&
            tg.initDataUnsafe.user &&
            tg.initDataUnsafe.user.id
        ){

            telegramId =
                String(
                    tg.initDataUnsafe.user.id
                );

        }

    }

}catch(error){

    telegramId = "";

}


/* ==========================================
   CREATE CRAZY USER ID
========================================== */

function createCrazyId(id){

    let number = 0;


    /*
     * Telegram ID থেকে
     * একই user-এর জন্য
     * একই code তৈরি হবে
     */

    for(
        let i = 0;
        i < id.length;
        i++
    ){

        number =
            (
                number * 31
            ) +
            id.charCodeAt(i);

        number =
            number % 1000000007;

    }


    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


    let code = "";


    for(
        let i = 0;
        i < 6;
        i++
    ){

        number =
            (
                number * 37
                + 17
            ) %
            1000000007;


        code +=
            chars[
                number % chars.length
            ];

    }


    return "CRAZY_" + code;

}


/* ==========================================
   SHOW CRAZY USER ID
========================================== */

if(telegramId){

    const crazyUserId =
        createCrazyId(
            telegramId
        );


    document.getElementById(
        "userId"
    ).textContent =
        crazyUserId;


    document.getElementById(
        "error"
    ).textContent = "";


}else{

    document.getElementById(
        "userId"
    ).textContent =
        "ID NOT FOUND";


    document.getElementById(
        "error"
    ).textContent =
        "Telegram Mini App-এর ভিতর থেকে Account খুলুন.";

}


/* ==========================================
   KEEP USER ID WHILE NAVIGATING
========================================== */

function pageUrl(page){

    if(telegramId){

        return (
            page +
            "?user_id=" +
            encodeURIComponent(
                telegramId
            )
        );

    }


    return page;

}


document.getElementById(
    "homeBtn"
).href =
    pageUrl("index.html");


document.getElementById(
    "ordersBtn"
).href =
    pageUrl("orders.html");


document.getElementById(
    "shopBtn"
).href =
    pageUrl("shop.html");


document.getElementById(
    "depositBtn"
).href =
    pageUrl("deposit.html");


/* ==========================================
   ACCOUNT DATA
========================================== */

let totalDeposit = 0;

let totalOrders = 0;


document.getElementById(
    "totalDeposit"
).textContent =
    "৳" + totalDeposit;


document.getElementById(
    "totalOrders"
).textContent =
    totalOrders;


/* ==========================================
   RANK SYSTEM
========================================== */

let rank =
    "🥉 BRONZE";


if(
    totalDeposit >=
    10000000000
){

    rank =
        "👑 MASTER";

}
else if(
    totalDeposit >=
    10000
){

    rank =
        "🔴 HEROIC";

}
else if(
    totalDeposit >=
    1000
){

    rank =
        "💎 DIAMOND";

}
else if(
    totalDeposit >=
    500
){

    rank =
        "🥈 SILVER";

}
else if(
    totalDeposit >=
    100
){

    rank =
        "🥉 BRONZE";

}


document.getElementById(
    "rank"
).textContent =
    rank;

</script>

</body>

    </html>
