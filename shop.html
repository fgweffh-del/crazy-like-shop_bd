<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crazy Like Shop</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#050507;
    color:#fff;
    min-height:100vh;
    padding-bottom:90px;
}

.container{
    width:100%;
    max-width:620px;
    margin:auto;
}

/* HEADER */

.header{
    text-align:center;
    padding:28px 18px 22px;

    background:
        radial-gradient(circle at 50% -20%,#9b3cff45,transparent 45%),
        linear-gradient(180deg,#100b17,#07060a);

    border-bottom:1px solid #30243b;
}

.crown{
    font-size:35px;
    filter:drop-shadow(0 0 12px #ffd45b);
}

.title{
    margin-top:5px;
    font-size:25px;
    font-weight:900;

    background:linear-gradient(
        90deg,
        #fff,
        #c66cff,
        #ffd45b
    );

    -webkit-background-clip:text;
    color:transparent;
}

.subtitle{
    margin-top:7px;
    color:#8e8797;
    font-size:10px;
}

/* CONTENT */

.content{
    padding:20px 16px;
}

.section-title{
    font-size:18px;
    font-weight:900;
    margin-bottom:14px;
}

/* SHOP CARD */

.shop-card{
    width:100%;
    padding:22px;
    margin-bottom:15px;

    border-radius:23px;

    background:
        radial-gradient(circle at 100% 0%,#963cff38,transparent 45%),
        linear-gradient(145deg,#1d1427,#0d0a11);

    border:1px solid #493255;

    box-shadow:0 0 28px #8b36ff12;

    cursor:pointer;
    transition:.18s;
}

.shop-card:active{
    transform:scale(.97);
}

.card-top{
    display:flex;
    align-items:center;
    gap:14px;
}

.icon{
    width:55px;
    height:55px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:18px;

    background:#281536;
    border:1px solid #70478d;

    font-size:28px;
}

.card-info{
    flex:1;
}

.card-title{
    font-size:17px;
    font-weight:900;
}

.card-text{
    margin-top:5px;
    color:#88818f;
    font-size:9px;
    line-height:1.5;
}

.arrow{
    color:#c66cff;
    font-size:22px;
}

.badge{
    display:inline-block;

    margin-top:15px;

    padding:6px 10px;

    border-radius:10px;

    background:#9a3cff16;
    border:1px solid #9a3cff35;

    color:#d49aff;

    font-size:8px;
    font-weight:bold;
}

/* FREE CARD */

.free-card{
    background:
        radial-gradient(circle at 100% 0%,#20d87825,transparent 45%),
        linear-gradient(145deg,#101d18,#090d0b);

    border-color:#28553e;
}

.free-card .icon{
    background:#102c20;
    border-color:#347957;
}

.free-card .arrow{
    color:#59e995;
}

.free-card .badge{
    color:#59e995;
    background:#39db7c12;
    border-color:#39db7c30;
}

/* BACK */

.back{
    width:100%;
    margin-top:10px;

    padding:15px;

    border-radius:17px;

    background:#121016;
    border:1px solid #302936;

    color:#aaa2b0;

    font-size:11px;
    font-weight:bold;

    cursor:pointer;
}

.back:active{
    transform:scale(.97);
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;

    left:50%;
    bottom:10px;

    transform:translateX(-50%);

    width:calc(100% - 22px);
    max-width:598px;

    height:67px;

    display:flex;
    align-items:center;
    justify-content:space-around;

    padding:6px;

    border-radius:22px;

    background:linear-gradient(
        145deg,
        #18121f,
        #0c0b10
    );

    border:1px solid #3a2d47;

    box-shadow:
        0 10px 35px #000000cc,
        0 0 25px #7d32b518;

    z-index:999;
}

.nav-button{
    width:52px;
    height:52px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:0;
    border-radius:17px;

    background:transparent;

    font-size:24px;

    cursor:pointer;
}

.nav-button:active{
    transform:scale(.86);
}

.nav-button.active{
    background:linear-gradient(
        145deg,
        #422457,
        #21132c
    );

    border:1px solid #75468f;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="crown">👑</div>

        <div class="title">
            CRAZY LIKE SHOP
        </div>

        <div class="subtitle">
            Premium Like Service • Fast Delivery
        </div>

    </div>


    <div class="content">

        <div class="section-title">
            🛒 SHOP
        </div>


        <!-- PREMIUM -->

        <div class="shop-card" onclick="openPremium()">

            <div class="card-top">

                <div class="icon">
                    👑
                </div>

                <div class="card-info">

                    <div class="card-title">
                        Premium Like
                    </div>

                    <div class="card-text">
                        Fast delivery • Premium service
                    </div>

                </div>

                <div class="arrow">
                    ›
                </div>

            </div>

            <div class="badge">
                ⭐ PREMIUM
            </div>

        </div>


        <!-- FREE -->

        <div class="shop-card free-card" onclick="openFree()">

            <div class="card-top">

                <div class="icon">
                    🎁
                </div>

                <div class="card-info">

                    <div class="card-title">
                        Free Like
                    </div>

                    <div class="card-text">
                        Get free like service
                    </div>

                </div>

                <div class="arrow">
                    ›
                </div>

            </div>

            <div class="badge">
                🎁 FREE SERVICE
            </div>

        </div>


        <button class="back" onclick="goHome()">
            ← BACK TO HOME
        </button>

    </div>

</div>


<!-- BOTTOM NAV -->

<div class="bottom-nav">

    <button class="nav-button" onclick="goHome()">
        🏠
    </button>

    <button class="nav-button" onclick="goOrders()">
        🧾
    </button>

    <button class="nav-button active">
        🛒
    </button>

    <button class="nav-button" onclick="goDeposit()">
        💳
    </button>

    <button class="nav-button" onclick="goAccount()">
        👤
    </button>

</div>


<script>

if(window.Telegram && window.Telegram.WebApp){

    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

}

function openPremium(){
    window.location.href="premium.html";
}

function openFree(){
    window.location.href="free.html";
}

function goHome(){
    window.location.href="index.html";
}

function goOrders(){
    window.location.href="orders.html";
}

function goDeposit(){
    window.location.href="deposit.html";
}

function goAccount(){
    alert("My Account coming soon");
}

</script>

</body>
  </html>
