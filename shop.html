<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crazy Like Shop</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

body{
    background:#07060b;
    color:white;
    min-height:100vh;
}

.container{
    max-width:600px;
    margin:auto;
    padding:20px;
}

/* HEADER */

.header{
    text-align:center;
    padding:25px 10px 30px;
}

.crown{
    font-size:45px;
    filter:drop-shadow(0 0 15px #ffd34d);
}

.title{
    margin-top:8px;
    font-size:25px;
    font-weight:900;
    background:linear-gradient(
        90deg,
        #ffffff,
        #c66cff,
        #ffd85a
    );
    -webkit-background-clip:text;
    color:transparent;
}

.subtitle{
    margin-top:8px;
    color:#8f8998;
    font-size:11px;
}

/* CARDS */

.card{
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    gap:15px;
    padding:22px;
    margin-bottom:16px;
    border-radius:23px;
    cursor:pointer;
    transition:.2s;
}

.card:active{
    transform:scale(.97);
}

/* PREMIUM */

.premium{
    background:
        radial-gradient(
            circle at 100% 0%,
            #9d42ff55,
            transparent 40%
        ),
        linear-gradient(
            145deg,
            #21122f,
            #0e0b13
        );

    border:1px solid #71418d;

    box-shadow:
        0 0 30px #8d36ff18;
}

/* FREE */

.free{
    background:
        radial-gradient(
            circle at 100% 0%,
            #2ee48635,
            transparent 40%
        ),
        linear-gradient(
            145deg,
            #10251b,
            #0b100d
        );

    border:1px solid #397654;

    box-shadow:
        0 0 30px #28d87912;
}

/* ICON */

.icon{
    min-width:62px;
    width:62px;
    height:62px;
    border-radius:19px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:30px;
}

.premium .icon{
    background:#321743;
    border:1px solid #8c4bb0;
}

.free .icon{
    background:#143523;
    border:1px solid #3d8b60;
}

/* TEXT */

.info{
    flex:1;
}

.card-title{
    font-size:18px;
    font-weight:900;
}

.card-text{
    margin-top:6px;
    color:#928b9b;
    font-size:10px;
    line-height:1.5;
}

.badge{
    display:inline-block;
    margin-top:9px;
    padding:5px 9px;
    border-radius:20px;
    font-size:8px;
    font-weight:bold;
}

.vip{
    color:#dca1ff;
    background:#a33cff18;
    border:1px solid #a34fdb44;
}

.free-badge{
    color:#70eca1;
    background:#27d87912;
    border:1px solid #42bb7044;
}

/* ARROW */

.arrow{
    font-size:30px;
    color:#ad70cf;
}

/* BACK */

.back{
    width:100%;
    padding:14px;
    margin-top:5px;

    border-radius:14px;
    border:1px solid #302a38;

    background:#111016;
    color:#aaa3b3;

    font-size:12px;
    font-weight:bold;
}

/* FOOTER */

.footer{
    text-align:center;
    margin-top:25px;
    color:#57515f;
    font-size:9px;
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="crown">
            👑
        </div>

        <div class="title">
            CRAZY LIKE SHOP
        </div>

        <div class="subtitle">
            Select your service
        </div>

    </div>


    <!-- PREMIUM LIKE -->

    <div
        class="card premium"
        onclick="openPremium()"
    >

        <div class="icon">
            👑
        </div>

        <div class="info">

            <div class="card-title">
                PREMIUM LIKE
            </div>

            <div class="card-text">
                High quality likes with fast
                and reliable delivery.
            </div>

            <span class="badge vip">
                ✦ VIP SERVICE
            </span>

        </div>

        <div class="arrow">
            ›
        </div>

    </div>


    <!-- FREE LIKE -->

    <div
        class="card free"
        onclick="openFree()"
    >

        <div class="icon">
            🆓
        </div>

        <div class="info">

            <div class="card-title">
                FREE LIKE
            </div>

            <div class="card-text">
                Get free likes from the
                available free service.
            </div>

            <span class="badge free-badge">
                ✓ FREE SERVICE
            </span>

        </div>

        <div class="arrow">
            ›
        </div>

    </div>


    <!-- BACK -->

    <button
        class="back"
        onclick="goHome()"
    >
        ← BACK TO HOME
    </button>


    <div class="footer">
        🔥 CRAZY LIKE • Premium Service
    </div>

</div>


<script>

/* TELEGRAM */

if(
    window.Telegram &&
    window.Telegram.WebApp
){

    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

}


/* PREMIUM PAGE */

function openPremium(){

    window.location.href = "premium.html";

}


/* FREE PAGE */

function openFree(){

    window.location.href = "free.html";

}


/* HOME */

function goHome(){

    window.location.href = "index.html";

}

</script>

</body>
              </html>
