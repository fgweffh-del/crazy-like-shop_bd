<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRAZY LIKE SHOP</title>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#08050d;
    color:white;
    font-family:Arial,sans-serif;
}
.container{
    max-width:430px;
    margin:auto;
    padding:25px 18px;
}
.logo{
    text-align:center;
    font-size:48px;
    margin-top:20px;
}
.title{
    text-align:center;
    font-size:26px;
    font-weight:bold;
    color:#d8a7ff;
}
.sub{
    text-align:center;
    color:#999;
    margin:8px 0 30px;
}
.box{
    background:#120b1d;
    border:1px solid #43205f;
    border-radius:18px;
    padding:22px;
}
input{
    width:100%;
    padding:15px;
    margin:8px 0;
    border-radius:12px;
    border:1px solid #4d2866;
    background:#09060e;
    color:white;
    outline:none;
    font-size:15px;
}
button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:0;
    border-radius:12px;
    background:linear-gradient(90deg,#7b2cff,#c05cff);
    color:white;
    font-weight:bold;
    font-size:16px;
}
.switch{
    text-align:center;
    margin-top:18px;
    color:#c38cff;
    cursor:pointer;
}
.message{
    text-align:center;
    margin-top:15px;
    min-height:20px;
    color:#ffcf70;
}
.shop{
    display:none;
}
.balance{
    background:linear-gradient(135deg,#24103b,#12091d);
    border:1px solid #6d3595;
    border-radius:18px;
    padding:22px;
    margin-top:20px;
}
.balance small{color:#aaa}
.balance h1{
    margin:8px 0 0;
    color:#e5b7ff;
}
.logout{
    background:#25152f;
    border:1px solid #713b8c;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN / REGISTER -->
<div id="authPage">

    <div class="logo">👑</div>
    <div class="title">CRAZY LIKE SHOP</div>
    <div class="sub">Premium Like Service • Fast Delivery</div>

    <div class="box">

        <h2 id="formTitle">Login</h2>

        <input
            id="name"
            type="text"
            placeholder="Enter Name"
            autocomplete="username"
        >

        <input
            id="password"
            type="password"
            placeholder="Enter Password"
            autocomplete="current-password"
        >

        <input
            id="confirmPassword"
            type="password"
            placeholder="Confirm Password"
            style="display:none"
            autocomplete="new-password"
        >

        <button id="mainButton" onclick="login()">
            Login
        </button>

        <div class="switch" onclick="toggleForm()" id="switchText">
            Create new account
        </div>

        <div class="message" id="message"></div>

    </div>
</div>


<!-- SHOP -->
<div id="shopPage" class="shop">

    <div class="logo">👑</div>

    <div class="title">
        CRAZY LIKE SHOP
    </div>

    <div class="sub">
        Premium Like Service • Fast Delivery
    </div>

    <div class="balance">
        <small>Welcome</small>
        <h2 id="userName">User</h2>

        <small>Balance</small>
        <h1 id="userBalance">৳ 0.00</h1>
    </div>

    <div class="box" style="margin-top:18px">
        <h3>🛒 Shop</h3>
        <p style="color:#aaa">
            Your shop products will appear here.
        </p>

        <button onclick="alert('Shop coming soon')">
            🛒 Open Shop
        </button>

        <button class="logout" onclick="logout()">
            🚪 Logout
        </button>
    </div>

</div>

</div>


<script>
const firebaseConfig = {
    apiKey: "AIzaSyBYmNKdD9nR3aGb993LYhkeo_bnWPDFt54",
    authDomain: "crazy-like-shop.firebaseapp.com",
    databaseURL: "https://crazy-like-shop-default-rtdb.firebaseio.com",
    projectId: "crazy-like-shop",
    storageBucket: "crazy-like-shop.firebasestorage.app",
    messagingSenderId: "819697907791",
    appId: "1:819697907791:web:c6159a0477113949ae923a",
    measurementId: "G-YHPWS2P85H"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let registerMode = false;


/* =========================
   TOGGLE LOGIN / REGISTER
========================= */

function toggleForm(){

    registerMode = !registerMode;

    const title = document.getElementById("formTitle");
    const button = document.getElementById("mainButton");
    const confirm = document.getElementById("confirmPassword");
    const switchText = document.getElementById("switchText");
    const message = document.getElementById("message");

    message.innerText = "";

    if(registerMode){

        title.innerText = "Create Account";

        button.innerText = "Create Account";

        button.onclick = register;

        confirm.style.display = "block";

        switchText.innerText = "Already have an account? Login";

    }else{

        title.innerText = "Login";

        button.innerText = "Login";

        button.onclick = login;

        confirm.style.display = "none";

        switchText.innerText = "Create new account";
    }
}


/* =========================
   REGISTER
========================= */

async function register(){

    const name =
        document.getElementById("name").value.trim();

    const password =
        document.getElementById("password").value;

    const confirm =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("message");


    if(name.length < 3){

        message.innerText =
            "❌ Name must be at least 3 characters";

        return;
    }


    if(!/^[a-zA-Z0-9_]+$/.test(name)){

        message.innerText =
            "❌ Only letters, numbers and _ allowed";

        return;
    }


    if(password.length < 6){

        message.innerText =
            "❌ Password must be at least 6 characters";

        return;
    }


    if(password !== confirm){

        message.innerText =
            "❌ Passwords do not match";

        return;
    }


    message.innerText =
        "⏳ Creating account...";


    try{

        /*
        Name-টাই Firebase UID/key
        */

        const userRef =
            db.ref("users/" + name);

        const snapshot =
            await userRef.once("value");


        if(snapshot.exists()){

            message.innerText =
                "❌ This name is already registered";

            return;
        }


        const userData = {

            uid: name,

            name: name,

            password: password,

            balance: 0,

            total_deposit: 0,

            total_orders: 0,

            created_at: Date.now()

        };


        await userRef.set(userData);


        message.innerText =
            "✅ Account created successfully";


        setTimeout(function(){

            openShop(userData);

        },800);


    }catch(error){

        console.log(error);

        message.innerText =
            "❌ " + error.message;
    }
}


/* =========================
   LOGIN
========================= */

async function login(){

    const name =
        document.getElementById("name").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");


    if(!name || !password){

        message.innerText =
            "❌ Enter name and password";

        return;
    }


    message.innerText =
        "⏳ Logging in...";


    try{

        const userRef =
            db.ref("users/" + name);

        const snapshot =
            await userRef.once("value");


        if(!snapshot.exists()){

            message.innerText =
                "❌ Account not found";

            return;
        }


        const userData =
            snapshot.val();


        if(userData.password !== password){

            message.innerText =
                "❌ Wrong password";

            return;
        }


        message.innerText =
            "✅ Login successful";


        openShop(userData);


    }catch(error){

        console.log(error);

        message.innerText =
            "❌ " + error.message;
    }
}


/* =========================
   OPEN SHOP
========================= */

function openShop(userData){

    document.getElementById("authPage").style.display =
        "none";

    document.getElementById("shopPage").style.display =
        "block";


    document.getElementById("userName").innerText =
        userData.name;


    document.getElementById("userBalance").innerText =
        "৳ " + Number(userData.balance || 0).toFixed(2);
}


/* =========================
   LOGOUT
========================= */

function logout(){

    document.getElementById("shopPage").style.display =
        "none";

    document.getElementById("authPage").style.display =
        "block";

    document.getElementById("name").value = "";

    document.getElementById("password").value = "";

    document.getElementById("confirmPassword").value = "";

    document.getElementById("message").innerText =
        "";

    registerMode = false;

    toggleForm();
}
</script>

</body>
        </html>
