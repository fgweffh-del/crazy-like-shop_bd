
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CRAZY_FUCK Jump Game</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  overflow: hidden;
  background: #10152d;
  font-family: Arial, sans-serif;
  touch-action: none;
}
canvas {
  display: block;
  width: 100vw;
  height: 100dvh;
}
#top {
  position: fixed;
  top: 12px;
  left: 12px;
  right: 12px;
  display: flex;
  justify-content: space-between;
  color: white;
  font-weight: bold;
  font-size: 15px;
  pointer-events: none;
  text-shadow: 2px 2px #111;
}
#controls {
  position: fixed;
  bottom: 22px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 20px;
}
.group {
  display: flex;
  gap: 12px;
}
button {
  width: 64px;
  height: 64px;
  border: 2px solid #ffffff80;
  border-radius: 18px;
  background: #253b72dd;
  color: white;
  font-size: 26px;
  font-weight: bold;
  touch-action: none;
  user-select: none;
}
#jump {
  width: 85px;
  height: 85px;
  border-radius: 50%;
  background: #ff5722ee;
}
#startScreen {
  position: fixed;
  inset: 0;
  background: #090e20df;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: white;
  gap: 18px;
}
#startScreen h1 {
  color: #ff5722;
  font-size: 34px;
  text-shadow: 2px 3px #000;
}
#startScreen p {
  text-align: center;
  line-height: 1.6;
  padding: 0 22px;
}
#play {
  width: 180px;
  height: 58px;
  background: #16b85b;
  border-radius: 14px;
  font-size: 20px;
}
</style>
</head>

<body>
<canvas id="game"></canvas>

<div id="top">
  <span>🔥 CRAZY_FUCK</span>
  <span>🏆 SCORE: <b id="score">0</b></span>
</div>

<div id="controls">
  <div class="group">
    <button id="left">◀</button>
    <button id="right">▶</button>
  </div>
  <button id="jump">⬆</button>
</div>

<div id="startScreen">
  <h1>CRAZY_FUCK</h1>
  <p>
    🔥 JUMP • RUN • CLIMB<br>
    গাড়ির ওপর দিয়ে লাফ দাও<br>
    বক্সে ওঠো এবং স্কোর বাড়াও!
  </p>
  <button id="play">▶ PLAY GAME</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");

let W, H, ground, camera = 0;
let running = false;
let score = 0;
let keys = { left:false, right:false };
let platforms = [];
let obstacles = [];
let player;

function resize() {
  W = canvas.width = innerWidth * devicePixelRatio;
  H = canvas.height = innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  W = innerWidth;
  H = innerHeight;
  ground = H - 115;
  if (!running) drawMenu();
}
addEventListener("resize", resize);

function resetGame() {
  camera = 0;
  score = 0;
  scoreText.textContent = 0;
  player = {
    x: W * 0.25,
    y: ground - 60,
    w: 32,
    h: 58,
    vx: 0,
    vy: 0,
    onGround: true
  };

  platforms = [
    {x:0, y:ground, w:W+200, h:30},
    {x:W*0.52, y:ground-105, w:105, h:18},
    {x:W*0.80, y:ground-175, w:110, h:18},
    {x:W*1.15, y:ground-115, w:115, h:18},
    {x:W*1.48, y:ground-220, w:120, h:18}
  ];

  obstacles = [
    {x:W*0.40, y:ground-42, w:95, h:42, type:"car"},
    {x:W*0.92, y:ground-68, w:45, h:68, type:"box"},
    {x:W*1.34, y:ground-48, w:100, h:48, type:"car"}
  ];

  // Generate more platforms
  for (let i=5; i<80; i++) {
    let prev = platforms[i-1];
    platforms.push({
      x: prev.x + 135 + Math.random()*65,
      y: Math.max(ground-300, prev.y - 35 - Math.random()*55),
      w: 85 + Math.random()*45,
      h: 18
    });
  }
  running = true;
  document.getElementById("startScreen").style.display = "none";
  requestAnimationFrame(loop);
}

function drawMenu() {
  ctx.fillStyle = "#10152d";
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = "#23365d";
  for(let i=0;i<12;i++) {
    ctx.fillRect(i*90, H-115-(i%3)*25, 70, 20);
  }
}

function drawBackground() {
  let g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#121b43");
  g.addColorStop(1,"#5c6bc0");
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  // Stars
  ctx.fillStyle = "#ffffff88";
  for(let i=0;i<45;i++) {
    let x = ((i*137 - camera*0.15) % (W+20) + W+20)%(W+20);
    let y = (i*71)%Math.max(1,H*0.65);
    ctx.fillRect(x,y,2,2);
  }
}

function drawPlatform(p) {
  let x = p.x-camera;
  if(x+p.w < -20 || x > W+20) return;
  ctx.fillStyle = "#27d68a";
  ctx.fillRect(x,p.y,p.w,p.h);
  ctx.fillStyle = "#147b54";
  ctx.fillRect(x,p.y+p.h-5,p.w,5);
}

function drawCar(o) {
  let x = o.x-camera;
  if(x+o.w < -20 || x > W+20) return;
  ctx.fillStyle = "#ff3d59";
  ctx.fillRect(x,o.y+12,o.w,o.h-12);
  ctx.fillStyle = "#ffc857";
  ctx.fillRect(x+15,o.y,o.w-30,18);
  ctx.fillStyle = "#a9e5ff";
  ctx.fillRect(x+20,o.y+3,20,12);
  ctx.fillRect(x+o.w-40,o.y+3,20,12);
  ctx.fillStyle = "#171a29";
  ctx.beginPath();
  ctx.arc(x+20,o.y+o.h,10,0,Math.PI*2);
  ctx.arc(x+o.w-20,o.y+o.h,10,0,Math.PI*2);
  ctx.fill();
}

function drawBox(o) {
  let x = o.x-camera;
  if(x+o.w < -20 || x > W+20) return;
  ctx.fillStyle = "#a56b35";
  ctx.fillRect(x,o.y,o.w,o.h);
  ctx.strokeStyle = "#ffda9b";
  ctx.lineWidth = 3;
  ctx.strokeRect(x+4,o.y+4,o.w-8,o.h-8);
  ctx.beginPath();
  ctx.moveTo(x+4,o.y+4);
  ctx.lineTo(x+o.w-4,o.y+o.h-4);
  ctx.moveTo(x+o.w-4,o.y+4);
  ctx.lineTo(x+4,o.y+o.h-4);
  ctx.stroke();
}

function drawPlayer() {
  let x = player.x-camera;
  let y = player.y;

  // Shadow
  ctx.fillStyle = "#0005";
  ctx.fillRect(x-5,y+player.h,42,5);

  // Head
  ctx.fillStyle = "#e7ad82";
  ctx.beginPath();
  ctx.arc(x+16,y+10,10,0,Math.PI*2);
  ctx.fill();

  // Hair
  ctx.fillStyle = "#211a19";
  ctx.fillRect(x+6,y,21,7);

  // Jacket
  ctx.fillStyle = "#15191f";
  ctx.fillRect(x+4,y+21,25,22);

  // Shirt detail
  ctx.fillStyle = "#ff5722";
  ctx.fillRect(x+14,y+22,5,18);

  // Arms
  ctx.strokeStyle = "#e7ad82";
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(x+6,y+25);
  ctx.lineTo(x-1,y+38);
  ctx.moveTo(x+27,y+25);
  ctx.lineTo(x+34,y+36);
  ctx.stroke();

  // Pants
  ctx.fillStyle = "#253e78";
  ctx.fillRect(x+5,y+42,10,12);
  ctx.fillRect(x+18,y+42,10,12);

  // Shoes
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(x+2,y+52,13,6);
  ctx.fillRect(x+17,y+52,14,6);

  // Name label
  ctx.font = "bold 12px Arial";
  ctx.textAlign = "center";
  ctx.fillStyle = "#fff";
  ctx.fillText("CRAZY_FUCK",x+16,y-9);
}

function jump() {
  if (!running) return;
  if (player.onGround) {
    player.vy = -13;
    player.onGround = false;
  }
}

function loop() {
  if (!running) return;

  drawBackground();

  player.vx = 0;
  if(keys.left) player.vx = -4;
  if(keys.right) player.vx = 4;

  player.x += player.vx;
  player.vy += 0.55;
  let oldY = player.y;
  player.y += player.vy;
  player.onGround = false;

  // Platform collision
  for(const p of platforms) {
    if(player.x+player.w > p.x &&
       player.x < p.x+p.w &&
       oldY+player.h <= p.y &&
       player.y+player.h >= p.y &&
       player.vy >= 0) {
      player.y = p.y-player.h;
      player.vy = 0;
      player.onGround = true;
    }
    drawPlatform(p);
  }

  // Obstacles
  for(const o of obstacles) {
    if(o.type === "car") drawCar(o);
    else drawBox(o);
  }

  // Camera follows player
  if(player.x-camera > W*0.48) {
    camera = player.x-W*0.48;
  }

  drawPlayer();

  score = Math.max(score,Math.floor(camera/10));
  scoreText.textContent = score;

  // Fall / restart
  if(player.y > H+100) {
    running = false;
    document.getElementById("startScreen").style.display = "flex";
    document.querySelector("#startScreen h1").textContent = "GAME OVER!";
    document.querySelector("#startScreen p").innerHTML =
      "🔥 CRAZY_FUCK<br>YOUR SCORE: "+score+"<br>আবার চেষ্টা করো!";
    document.getElementById("play").textContent = "↻ PLAY AGAIN";
    return;
  }

  requestAnimationFrame(loop);
}

function bindButton(id, key) {
  const el = document.getElementById(id);
  el.addEventListener("pointerdown", e => {
    e.preventDefault();
    keys[key] = true;
    el.setPointerCapture(e.pointerId);
  });
  function stop(e) {
    keys[key] = false;
  }
  el.addEventListener("pointerup", stop);
  el.addEventListener("pointercancel", stop);
  el.addEventListener("lostpointercapture", stop);
}

bindButton("left","left");
bindButton("right","right");

document.getElementById("jump").addEventListener("pointerdown",e=>{
  e.preventDefault();
  jump();
});

addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft" || e.key==="a") keys.left=true;
  if(e.key==="ArrowRight" || e.key==="d") keys.right=true;
  if(e.key==="ArrowUp" || e.key===" " ) jump();
});

addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft" || e.key==="a") keys.left=false;
  if(e.key==="ArrowRight" || e.key==="d") keys.right=false;
});

document.getElementById("play").addEventListener("click",resetGame);

resize();
drawMenu();
</script>
</body>
</html>
