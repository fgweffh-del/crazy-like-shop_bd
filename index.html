<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CRAZY CITY 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#9fc5df;font-family:Arial}
#hud{position:fixed;top:10px;left:10px;color:white;background:#101820dd;padding:12px;border-radius:12px;z-index:5;line-height:1.7}
#msg{color:#ffe66d;font-weight:bold}
#controls{position:fixed;bottom:15px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;z-index:5}
.pad{display:grid;grid-template-columns:48px 48px 48px;gap:4px}
button{background:#17232ddd;color:white;border:1px solid #ffffff88;border-radius:12px;min-width:45px;min-height:45px;font-weight:bold;touch-action:none}
#actions{display:grid;grid-template-columns:repeat(2,58px);gap:6px}
#start{position:fixed;inset:0;background:#101820f5;color:white;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#start button{padding:10px 18px;background:#087f5b;margin:3px}
#end{display:none;position:fixed;inset:0;z-index:9;background:#101820ee;color:white;align-items:center;justify-content:center;flex-direction:column;text-align:center}
#end button{padding:12px 22px}
</style>
</head>
<body>

<div id="hud">
<b>🔥 CRAZY CITY 3D</b><br>
Character: <span id="who">CRAZY ARIB</span><br>
Power: <span id="power">0</span>/1<br>
Police: <span id="wanted">SAFE</span><br>
<span id="msg">Power building খুঁজে বের করো</span>
</div>

<div id="controls">
 <div class="pad">
  <span></span><button id="up">▲</button><span></span>
  <button id="left">◀</button><button id="down">▼</button><button id="right">▶</button>
 </div>
 <div id="actions">
  <button id="run">RUN</button><button id="jump">JUMP</button>
  <button id="crouch">CROUCH</button><button id="use">USE</button>
 </div>
</div>

<div id="start">
 <h1>🔥 CRAZY CITY 3D</h1>
 <p>Open City • Power Mission • Police Chase</p>
 <p>নিজের Character বেছে নাও</p>
 <button onclick="begin('CRAZY ARIB')">CRAZY ARIB</button>
 <button onclick="begin('CRAZY NAZIM')">CRAZY NAZIM</button>
 <button onclick="begin('CRAZY HABIB')">CRAZY HABIB</button>
 <p>চালাতে ইন্টারনেট লাগবে</p>
</div>

<div id="end">
 <h1 id="endTitle">MISSION COMPLETE</h1>
 <p id="endText"></p>
 <button onclick="location.reload()">PLAY AGAIN</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9fc5df);
scene.fog=new THREE.Fog(0x9fc5df,100,270);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,600);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdcecff,0x59634c,2));
const sun=new THREE.DirectionalLight(0xfff0d4,3);
sun.position.set(70,100,50);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

const material=(c,r=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const groundMat=material(0x667b4d),roadMat=material(0x30353b);
const whiteMat=material(0xe8e7d9),glassMat=material(0x5b9ebc,.22);
const skinMat=material(0xc58d69);
const buildingMats=[0xb8a18a,0xc7c4bb,0x9ba8ad,0xd1bba0].map(c=>material(c));

function box(x,y,z,w,h,d,m){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
 o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o;
}

const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),groundMat);
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// শহরের রাস্তা
box(0,.04,0,300,.08,14,roadMat);
box(0,.04,0,14,.08,300,roadMat);
for(let i=-140;i<=140;i+=12){
 box(i,.09,0,5,.025,.14,whiteMat);
 box(0,.09,i,.14,.025,5,whiteMat);
}

// সাধারণ শহরের বিল্ডিং
for(let x=-112;x<=112;x+=28){
 for(let z=-112;z<=112;z+=28){
  if(Math.abs(x)<18||Math.abs(z)<18)continue;
  const w=12+Math.random()*5,d=12+Math.random()*5,h=10+Math.random()*25;
  box(x,.25,z,w,.5,d,material(0xb7b8b1));
  box(x,h/2+.5,z,w,h,d,buildingMats[Math.floor(Math.random()*buildingMats.length)]);
  box(x,h+.8,z,w+.3,.6,d+.3,material(0x484d53));
  for(let yy=3;yy<h-1;yy+=3){
   for(let xx=-w/2+1;xx<w/2-1;xx+=2.5){
    box(x+xx,yy,z+d/2+.03,1,1.35,.06,glassMat);
   }
  }
 }
}

// রাস্তার গাছ
function tree(x,z){
 const trunk=box(x,1.2,z,.6,2.4,.6,material(0x65432b));
 const leaves=new THREE.Mesh(new THREE.SphereGeometry(1.8,10,9),material(0x416b39));
 leaves.position.set(x,3.6,z);leaves.castShadow=true;scene.add(leaves);
}
for(let i=-120;i<=120;i+=18){tree(i,11);tree(i,-11);}

// চরিত্র: আপাতত placeholder 3D model
const player=new THREE.Group();scene.add(player);
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.4,.65,5,10),material(0x1c304b));
body.position.y=1.2;body.castShadow=true;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.28,20,16),skinMat);
head.position.y=2;head.castShadow=true;player.add(head);
const legs=[];
for(const x of [-.18,.18]){
 const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.14,.62,4,8),material(0x292b32));
 leg.position.set(x,.45,0);leg.castShadow=true;player.add(leg);legs.push(leg);
}
const arms=[];
for(const x of [-.48,.48]){
 const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.55,4,8),skinMat);
 arm.position.set(x,1.25,0);player.add(arm);arms.push(arm);
}
const labelCanvas=document.createElement('canvas');
labelCanvas.width=512;labelCanvas.height=96;
const lctx=labelCanvas.getContext('2d');
const labelTexture=new THREE.CanvasTexture(labelCanvas);
const nameLabel=new THREE.Sprite(new THREE.SpriteMaterial({map:labelTexture}));
nameLabel.position.y=2.75;nameLabel.scale.set(3, .56, 1);player.add(nameLabel);

function setLabel(name){
 lctx.fillStyle='#101820';lctx.fillRect(0,0,512,96);
 lctx.fillStyle='#ffffff';lctx.font='bold 44px Arial';lctx.textAlign='center';
 lctx.fillText(name,256,64);labelTexture.needsUpdate=true;
 document.getElementById('who').textContent=name;
}

// Power mission buildings with visible entrance
function missionBuilding(x,z,title){
 box(x,2,z,14,4,12,buildingMats[1]);
 box(x,4.3,z,14,.4,12,material(0x454a50));
 // front wall on either side, with entrance gap
 box(x-5,2,z+6,4,4,.35,buildingMats[1]);
 box(x+5,2,z+6,4,4,.35,buildingMats[1]);
 for(const xx of [x-4,x+4]){
  box(xx,2,z+6.22,1.2,1.2,.05,glassMat);
 }
 const c=document.createElement('canvas');c.width=512;c.height=96;
 const cx=c.getContext('2d');cx.fillStyle='#111923';cx.fillRect(0,0,512,96);
 cx.fillStyle='#ffdf70';cx.font='bold 40px Arial';cx.textAlign='center';
 cx.fillText(title,256,62);
 const sign=new THREE.Mesh(new THREE.PlaneGeometry(8,1.5),
 new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c)}));
 sign.position.set(x,5,z+6.25);scene.add(sign);
}
missionBuilding(35,-25,'POWER BUILDING 1');
missionBuilding(-42,38,'POWER BUILDING 2');

// নিজের বাড়ি
box(18,2,35,10,4,9,material(0xbda58a));
box(18,4.3,35,11,.5,10,material(0x773f35));
box(18,1.4,39.6,2.2,2.8,.15,material(0x573e2b));
box(18,.12,44,5,.1,3,material(0x30c878));

// Power item
const coreMat=new THREE.MeshStandardMaterial({
 color:0x29f3ff,emissive:0x007bff,emissiveIntensity:3,metalness:.4,roughness:.2
});
const core=new THREE.Mesh(new THREE.IcosahedronGeometry(.9,1),coreMat);
core.position.set(35,1.5,-25);scene.add(core);
const ring=new THREE.Mesh(new THREE.TorusGeometry(1.3,.07,8,32),
new THREE.MeshBasicMaterial({color:0x43eaff}));
ring.position.copy(core.position);ring.rotation.x=Math.PI/2;scene.add(ring);

// অনেক পথচারী
const people=[];
for(let i=0;i<55;i++){
 const p=new THREE.Group();
 const shirt=material(new THREE.Color().setHSL(Math.random(),.5,.43));
 const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.25,.55,4,8),shirt);
 torso.position.y=1.05;p.add(torso);
 const h=new THREE.Mesh(new THREE.SphereGeometry(.2,12,10),skinMat);
 h.position.y=1.8;p.add(h);
 p.position.set((Math.random()-.5)*230,0,(Math.random()-.5)*230);
 scene.add(p);people.push({p,dir:Math.random()*6.28});
}

// তিনজন পুলিশ
const police=[];
function makePolice(name,x,z){
 const p=new THREE.Group();
 const uniform=material(0x172c4b);
 const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.34,.65,4,8),uniform);
 torso.position.y=1.2;p.add(torso);
 const h=new THREE.Mesh(new THREE.SphereGeometry(.24,16,12),skinMat);
 h.position.y=2;p.add(h);
 const cap=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.12,16),material(0x101a2a));
 cap.position.y=2.23;p.add(cap);
 const badge=box(0,1.35,.34,.12,.18,.04,material(0xffd45b));
 p.position.set(x,0,z);scene.add(p);

 const c=document.createElement('canvas');c.width=512;c.height=90;
 const cx=c.getContext('2d');cx.fillStyle='#101820';cx.fillRect(0,0,512,90);
 cx.fillStyle='#fff';cx.font='bold 42px Arial';cx.textAlign='center';cx.fillText(name,256,60);
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c)}));
 sp.position.y=2.8;sp.scale.set(3,.53,1);p.add(sp);
 police.push({p,name,origin:new THREE.Vector3(x,0,z)});
}
makePolice('CRAZY NAZIM',55,15);
makePolice('CRAZY ARIB',-55,-15);
makePolice('CRAZY HABIB',10,-65);

// Controls
const keys={};
for(const id of ['up','down','left','right','run','jump','crouch','use']){
 const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();keys[id]=true;});
 for(const ev of ['pointerup','pointercancel','pointerleave'])
  b.addEventListener(ev,()=>keys[id]=false);
}
addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.code==='Space')keys.jump=true;
});
addEventListener('keyup',e=>{
 keys[e.key.toLowerCase()]=false;
 if(e.code==='Space')keys.jump=false;
});

let started=false,hasPower=false,alarm=false,caught=false,won=false;
let jumpY=0,velocityY=0,alarmTimer=null;
const msg=document.getElementById('msg');
const powerText=document.getElementById('power');
const wantedText=document.getElementById('wanted');

window.begin=(name)=>{
 started=true;setLabel(name);
 player.position.set(18,0,48);
 document.getElementById('start').style.display='none';
 msg.textContent='Power building-এ যাও';
};

function finish(win){
 if(caught||won)return;
 if(win)won=true;else caught=true;
 document.getElementById('end').style.display='flex';
 document.getElementById('endTitle').textContent=win?'🏆 YOU WIN!':'🚔 JAILED!';
 document.getElementById('endText').textContent=win?
 'Power নিয়ে পুলিশকে ফাঁকি দিয়ে বাড়ি ফিরেছ!':
 'পুলিশ তোমাকে ধরে ফেলেছে। Mission Failed!';
}

function playAlarm(){
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  const ac=new AC(),osc=ac.createOscillator(),gain=ac.createGain();
  osc.type='sawtooth';gain.gain.value=.035;
  osc.connect(gain);gain.connect(ac.destination);osc.start();
  let high=true;
  alarmTimer=setInterval(()=>{
   osc.frequency.setValueAtTime(high?850:600,ac.currentTime);high=!high;
  },350);
  setTimeout(()=>{clearInterval(alarmTimer);osc.stop();ac.close();},12000);
 }catch(e){}
}

const temp=new THREE.Vector3();
let previous=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-previous)/1000,.04);previous=now;
 core.rotation.y+=dt;
 core.position.y=1.5+Math.sin(now*.003)*.25;
 ring.rotation.z+=dt*.8;

 if(started&&!caught&&!won){
  const forward=(keys.up||keys.w||keys['arrowup']?1:0)-
                (keys.down||keys.s||keys['arrowdown']?1:0);
  const side=(keys.right||keys.d||keys['arrowright']?1:0)-
             (keys.left||keys.a||keys['arrowleft']?1:0);
  const moving=forward!==0||side!==0;
  const crouching=!!keys.crouch;
  const speed=(keys.run?9:4.5)*(crouching?.5:1);
  if(moving){
   const direction=new THREE.Vector3(side,0,-forward).normalize();
   player.position.addScaledVector(direction,speed*dt);
   player.rotation.y=Math.atan2(direction.x,direction.z)+Math.PI;
   legs[0].rotation.x=Math.sin(now*.012)*(keys.run?1:.5);
   legs[1].rotation.x=-legs[0].rotation.x;
   arms[0].rotation.x=-legs[0].rotation.x*.7;
   arms[1].rotation.x=-legs[1].rotation.x*.7;
  }else{
   legs.forEach(l=>l.rotation.x=0);
   arms.forEach(a=>a.rotation.x=0);
  }

  body.scale.y=crouching?.7:1;
  head.position.y=crouching?1.75:2;
  if(keys.jump&&jumpY===0){velocityY=7;jumpY=1;}
  player.position.y+=velocityY*dt;
  velocityY-=18*dt;
  if(player.position.y<=0){player.position.y=0;velocityY=0;jumpY=0;}

  // map boundary
  player.position.x=THREE.MathUtils.clamp(player.position.x,-145,145);
  player.position.z=THREE.MathUtils.clamp(player.position.z,-145,145);

  // Power সংগ্রহ করলে অ্যালার্ম
  if(!hasPower&&distance2D(player.position,core.position)<3){
   hasPower=true;scene.remove(core);scene.remove(ring);
   powerText.textContent='1';alarm=true;
   wantedText.textContent='🚨 CHASE';
   msg.textContent='ALARM! পুলিশ থেকে পালাও!';
   playAlarm();
  }

  // Police chase
  for(const cop of police){
   const p=cop.p;
   if(alarm){
    temp.copy(player.position).sub(p.position);temp.y=0;
    const dist=temp.length();
    if(dist>1.6){
     temp.normalize();p.position.addScaledVector(temp,dt*5.5);
     p.rotation.y=Math.atan2(temp.x,temp.z);
    }
    if(dist<1.65)finish(false);
   }else{
    const t=now*.00045;
    p.position.x=cop.origin.x+Math.sin(t+cop.origin.z)*5;
    p.position.z=cop.origin.z+Math.cos(t+cop.origin.x)*5;
   }
  }

  // Power নিয়ে নিজের বাড়িতে ফিরলে Win
  if(hasPower&&distance2D(player.position,new THREE.Vector3(18,0,44))<5){
   finish(true);
  }

  // pedestrian movement
  people.forEach(o=>{
   o.p.position.x+=Math.cos(o.dir)*dt*.8;
   o.p.position.z+=Math.sin(o.dir)*dt*.8;
   if(Math.random()<.004)o.dir=Math.random()*6.28;
  });

  // third person follow camera
  const behind=new THREE.Vector3(
   Math.sin(player.rotation.y)*8,5.2,
   Math.cos(player.rotation.y)*8
  );
  const target=player.position.clone().add(behind);
  camera.position.lerp(target,.09);
  camera.lookAt(player.position.x,player.position.y+1.2,player.position.z);
 }else if(!started){
  camera.position.set(0,45,75);camera.lookAt(0,0,0);
 }
 renderer.render(scene,camera);
}
function distance2D(a,b){
 return Math.hypot(a.x-b.x,a.z-b.z);
}
requestAnimationFrame(animate);

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
