<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Free Like</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#050507;
    color:#fff;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:620px;
    margin:auto;
    padding:25px 14px;
}

.box{
    padding:28px 20px;
    text-align:center;

    border-radius:24px;

    background:
        radial-gradient(
            circle at 50% 0%,
            #7130a535,
            transparent 65%
        ),
        linear-gradient(
            145deg,
            #1a1222,
            #0b090e
        );

    border:1px solid #493052;

    box-shadow:
        0 0 30px #8b36ff18;
}

.icon{
    font-size:42px;
    filter:drop-shadow(0 0 12px #9b3cff);
}

.title{
    margin-top:10px;

    font-size:25px;
    font-weight:900;

    background:
        linear-gradient(
            90deg,
            #fff,
            #c66cff,
            #ffd45b
        );

    -webkit-background-clip:text;
    color:transparent;
}

.subtitle{
    margin-top:8px;

    color:#8d8595;
    font-size:10px;
    line-height:1.6;
}

.free-card{
    margin-top:22px;

    padding:20px;

    border-radius:18px;

    background:#100d14;
    border:1px solid #3b2b45;
}

.free-title{
    font-size:15px;
    font-weight:900;
}

.free-text{
    margin-top:8px;

    color:#77717f;
    font-size:9px;
    line-height:1.7;
}

.open{
    width:100%;
    height:50px;

    margin-top:18px;

    border:0;
    border-radius:14px;

    background:
        linear-gradient(
            90deg,
            #7130a5,
            #a13cff
        );

    color:#fff;

    font-size:11px;
    font-weight:900;

    cursor:pointer;
}

.open:active{
    transform:scale(.96);
}
</style>
</head>

<body>

<div class="container">

    <div class="box">

        <div class="icon">
            🆓
        </div>

        <div class="title">
            FREE LIKE
        </div>

        <div class="subtitle">
            Get your free like service from our Telegram.
        </div>


        <div class="free-card">

            <div class="free-title">
                ❤️ FREE LIKE SERVICE
            </div>

            <div class="free-text">
                Tap the button below to open our Telegram
                and get the free like service.
            </div>

            <button class="open" onclick="openTelegram()">
                🚀 OPEN TELEGRAM
            </button>

        </div>

    </div>

</div>


<script>

if(window.Telegram && window.Telegram.WebApp){

    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

}

function openTelegram(){

    window.location.href =
        "https://t.me/CRAZY_LIKE_BOT";

}

</script>

</body>
</html>
