<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Crazy Admin Panel</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    background:#050507;
    color:#fff;
    font-family:Arial,sans-serif;
}
.app{
    max-width:700px;
    margin:auto;
    padding:18px 14px 90px;
}
.header{text-align:center;padding:18px 0 22px}
.logo{
    font-size:55px;
    text-shadow:0 0 20px #a020f0;
}
.title{
    font-size:25px;
    font-weight:800;
    color:#d59cff;
    text-shadow:0 0 14px #8b20c9;
}
.subtitle{color:#888;font-size:12px;margin-top:6px}

.admin-card{
    padding:18px;
    border-radius:18px;
    border:1px solid #7020a0;
    background:linear-gradient(135deg,#14091c,#08080b);
    box-shadow:0 0 22px #461060;
}
.admin-name{font-size:19px;font-weight:bold}
.admin-id{color:#999;font-size:13px;margin-top:6px}
.active{
    display:inline-block;
    margin-top:12px;
    padding:6px 12px;
    border-radius:20px;
    background:#10301a;
    color:#52ff8b;
    font-size:12px;
}

.section{margin-top:24px}
.section-title{
    color:#d49aff;
    font-size:14px;
    font-weight:bold;
    margin-bottom:11px;
}
.grid{
    display:flex;
    flex-direction:column;
    gap:10px;
}
.btn{
    width:100%;
    min-height:58px;
    border-radius:15px;
    padding:13px 16px;
    text-align:left;
    color:#fff;
    background:linear-gradient(135deg,#13091a,#08080b);
    border:1px solid #61207f;
    box-shadow:0 0 10px rgba(150,40,220,.2);
}
.btn:active{transform:scale(.98)}
.btn-title{font-size:16px;font-weight:bold}
.btn-info{font-size:11px;color:#888;margin-top:4px}

.purple{border-color:#7523a3}
.gold{border-color:#a07a18}
.red{border-color:#922020}
.blue{border-color:#205d9c}
.green{border-color:#267a42}

.hidden{display:none!important}

.modal{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.85);
    padding:15px;
    z-index:100;
}
.modal.show{display:flex}
.modal-box{
    width:100%;
    max-width:520px;
    max-height:90vh;
    overflow:auto;
    padding:20px;
    border-radius:20px;
    background:#0b080f;
    border:1px solid #7523a3;
}
.modal-title{
    font-size:20px;
    color:#d49cff;
    font-weight:bold;
    margin-bottom:15px;
}
.input{
    width:100%;
    padding:14px;
    margin-bottom:10px;
    border-radius:12px;
    border:1px solid #4b3157;
    background:#050507;
    color:#fff;
    outline:none;
}
.permission-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}
.permission{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px;
    border:1px solid #302336;
    border-radius:10px;
    background:#09070b;
}
.permission input{
    width:18px;
    height:18px;
}
.action{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:0;
    border-radius:12px;
    background:#7625a5;
    color:white;
    font-weight:bold;
}
.close{
    background:#29101a;
    border:1px solid #7b2635;
}
.bottom{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    padding:11px;
    text-align:center;
    background:#08070b;
    border-top:1px solid #29202f;
}
.back{
    padding:10px 28px;
    border-radius:12px;
    background:#12091a;
    border:1px solid #65228c;
    color:#fff;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
    <div class="logo">👑</div>
    <div class="title">CRAZY ADMIN PANEL</div>
    <div class="subtitle">Secure Administration System</div>
</div>

<div class="admin-card">
    <div class="admin-name" id="adminName">MAIN ADMIN</div>
    <div class="admin-id" id="adminId">
        Telegram ID: 6346808004
    </div>
    <div class="active">● ACTIVE ADMIN</div>
</div>


<!-- DASHBOARD -->
<div class="section">
<div class="section-title">📊 DASHBOARD</div>
<div class="grid">

<button class="btn purple" data-permission="dashboard">
<div class="btn-title">📊 Dashboard</div>
<div class="btn-info">System overview</div>
</button>

<button class="btn blue" data-permission="statistics">

</button>

</div>
</div>


<!-- USER MANAGEMENT -->

<button class="btn green" data-permission="unban">

</div>
</div>


<!-- DEPOSIT -->
<div class="section">

<div class="grid">

<button class="btn gold" data-permission="deposit">

</button>

<button class="btn purple" data-permission="payment_numbers">

<button class="btn blue" data-permission="deposit_info">

<button class="btn green" data-permission="add_product">

<button class="btn purple" data-permission="edit_product">

</button>

<button class="btn red" data-permission="delete_product">

<button class="btn gold" data-permission="change_price">

</button>

</div>


<!-- ORDERS -->
<div class="section">

<div class="grid">

<button class="btn purple" data-permission="orders">
<div class="btn-title">🛒 Orders</div>
<div class="btn-info">Manage all orders</div>
</button>

<button class="btn blue" data-permission="chat_user">
<div class="btn-title">💬 Chat User</div>
<div class="btn-info">Contact users</div>
</button>

<button class="btn purple" data-permission="broadcast">
<div class="btn-title">📢 Broadcast</div>
<div class="btn-info">Broadcast message</div>
</button>

<button class="btn gold" data-permission="call_all">
<div class="btn-title">📣 Call All</div>

</button>

</div>
</div>


<!-- PASS -->
<div class="section">
<div class="section-title">🔐 PASS MANAGEMENT</div>
<div class="grid">

<button class="btn gold" data-permission="protect_pass">
<div class="btn-title">🔐 Protect Pass</div>
<div class="btn-info">Manage protection passes</div>
</button>

<button class="btn purple" data-permission="pass_stock">
<div class="btn-title">🔑 Pass Stock</div>
<div class="btn-info">Manage pass stock</div>
</button>

</div>
</div>


<!-- RESELLER -->
<div class="section">
<div class="section-title">👑 RESELLER</div>
<div class="grid">

<button class="btn gold" data-permission="reseller">
<div class="btn-title">👑 Reseller Management</div>
<div class="btn-info">Manage resellers</div>
</button>

<button class="btn blue" data-permission="reseller_dashboard">
<div class="btn-title">📊 Reseller Dashboard</div>

</button>

<button class="btn gold" data-permission="top_seller">
<div class="btn-title">🏆 Top Seller</div>

</button>

</div>
</div>


<!-- BOT CONTROL -->
<div class="section">
<div class="section-title">⚙️ BOT CONTROL</div>
<div class="grid">

<button class="btn red" data-permission="bot_off">

<div class="btn-info">Turn bot off</div>
</button>

<button class="btn green" data-permission="bot_on">

</button>

<button class="btn purple" data-permission="settings">
<div class="btn-title">⚙️ Settings</div>
<div class="btn-info">System settings</div>
</button>

<button class="btn blue" data-permission="info">
<div class="btn-title">ℹ️ Info</div>
<div class="btn-info">Manage information</div>
</button>

</div>
</div>


<!-- ADMIN MANAGEMENT -->
<div class="section">
<div class="section-title">👑 ADMIN MANAGEMENT</div>
<div class="grid">

<button class="btn gold" data-permission="admin_management">
<div class="btn-title">👑 Admin Management</div>
<div class="btn-info">Add admin & set access</div>
</button>

<button class="btn purple" data-permission="admin_list">
<div class="btn-title">👥 Admin List</div>
<div class="btn-info">View admins</div>
</button>

<button class="btn green" data-permission="add_admin">
<div class="btn-title">➕ Add Admin</div>
<div class="btn-info">Create admin access</div>
</button>

<button class="btn red" data-permission="remove_admin">
<div class="btn-title">🗑️ Remove Admin</div>
<div class="btn-info">Remove admin access</div>
</button>

<button class="btn blue" data-permission="admin_permissions">
<div class="btn-title">🔐 Admin Permissions</div>
<div class="btn-info">Manage admin access</div>
</button>

</div>
</div>

</div>


<!-- ADMIN MODAL -->
<div class="modal" id="adminModal">

<div class="modal-box">

<div class="modal-title">👑 ADD ADMIN</div>

<input
    class="input"
    id="newAdminId"
    type="number"
    placeholder="Telegram User ID"
>

<div class="section-title">🔐 SELECT ACCESS</div>

<div class="permission-list">

<label class="permission"><input type="checkbox" value="dashboard">📊 Dashboard</label>
<label class="permission"><input type="checkbox" value="users">👥 Users</label>
<label class="permission"><input type="checkbox" value="search_user">🔎 User Search</label>
<label class="permission"><input type="checkbox" value="add_balance">➕ Add Balance</label>
<label class="permission"><input type="checkbox" value="cut_balance">➖ Cut Balance</label>
<label class="permission"><input type="checkbox" value="user_balance">💰 User Balance</label>
<label class="permission"><input type="checkbox" value="user_history">🧾 User History</label>
<label class="permission"><input type="checkbox" value="user_orders">📦 User Orders</label>
<label class="permission"><input type="checkbox" value="ban">🚫 Ban</label>
<label class="permission"><input type="checkbox" value="unban">✅ Unban</label>
<label class="permission"><input type="checkbox" value="deposit">💳 Deposit</label>
<label class="permission"><input type="checkbox" value="payment_numbers">📱 Payment Numbers</label>
<label class="permission"><input type="checkbox" value="deposit_info">📝 Deposit Info</label>
<label class="permission"><input type="checkbox" value="deposit_history">📜 Deposit History</label>
<label class="permission"><input type="checkbox" value="add_product">➕ Add Product</label>
<label class="permission"><input type="checkbox" value="edit_product">✏️ Edit Product</label>
<label class="permission"><input type="checkbox" value="delete_product">🗑️ Delete Product</label>
<label class="permission"><input type="checkbox" value="change_price">💵 Change Price</label>
<label class="permission"><input type="checkbox" value="stock">📊 Stock</label>
<label class="permission"><input type="checkbox" value="orders">🛒 Orders</label>
<label class="permission"><input type="checkbox" value="chat_user">💬 Chat User</label>
<label class="permission"><input type="checkbox" value="broadcast">📢 Broadcast</label>
<label class="permission"><input type="checkbox" value="call_all">📣 Call All</label>
<label class="permission"><input type="checkbox" value="protect_pass">🔐 Protect Pass</label>
<label class="permission"><input type="checkbox" value="pass_stock">🔑 Pass Stock</label>
<label class="permission"><input type="checkbox" value="reseller">👑 Reseller</label>
<label class="permission"><input type="checkbox" value="reseller_dashboard">📊 Reseller Dashboard</label>
<label class="permission"><input type="checkbox" value="top_seller">🏆 Top Seller</label>
<label class="permission"><input type="checkbox" value="statistics">📈 Statistics</label>
<label class="permission"><input type="checkbox" value="settings">⚙️ Settings</label>
<label class="permission"><input type="checkbox" value="info">ℹ️ Info</label>
<label class="permission"><input type="checkbox" value="bot_off">🔴 Bot OFF</label>
<label class="permission"><input type="checkbox" value="bot_on">🟢 Bot ON</label>

</div>

<button class="action" id="saveAdmin">
✅ SAVE ADMIN
</button>

<button class="action close" id="closeModal">
❌ CLOSE
</button>

</div>
</div>


<div class="bottom">
<button class="back" id="backBtn">← CLOSE ADMIN</button>
</div>


<script>

const MAIN_ADMIN_ID = "6346808004";

if(window.Telegram && Telegram.WebApp){
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
}

let tgUser = null;

if(
    window.Telegram &&
    Telegram.WebApp &&
    Telegram.WebApp.initDataUnsafe &&
    Telegram.WebApp.initDataUnsafe.user
){
    tgUser = Telegram.WebApp.initDataUnsafe.user;
}

if(tgUser){

    document.getElementById("adminName").innerText =
        tgUser.first_name || "ADMIN";

    document.getElementById("adminId").innerText =
        "Telegram ID: " + tgUser.id;

}else{

    document.getElementById("adminName").innerText =
        "MAIN ADMIN";

    document.getElementById("adminId").innerText =
        "Telegram ID: " + MAIN_ADMIN_ID;
}


/*
MAIN ADMIN = FULL ACCESS
*/

let permissions = [];

if(
    tgUser &&
    String(tgUser.id) === MAIN_ADMIN_ID
){

permissions = [

"dashboard",
"statistics",

"users",
"search_user",
"add_balance",
"cut_balance",
"user_balance",
"user_history",
"user_orders",
"ban",
"unban",

"deposit",
"payment_numbers",
"deposit_info",
"deposit_history",

"add_product",
"edit_product",
"delete_product",
"change_price",
"stock",

"orders",
"chat_user",
"broadcast",
"call_all",

"protect_pass",
"pass_stock",

"reseller",
"reseller_dashboard",
"top_seller",

"settings",
"info",
"bot_off",
"bot_on",

"admin_management",
"admin_list",
"add_admin",
"remove_admin",
"admin_permissions"

];

}


/*
HIDE ACCESS WITHOUT PERMISSION
*/

document.querySelectorAll("[data-permission]")
.forEach(function(button){

    const p = button.getAttribute("data-permission");

    if(!permissions.includes(p)){
        button.classList.add("hidden");
    }

});


/*
BUTTON ACTION
*/

document.querySelectorAll(".btn")
.forEach(function(button){

button.addEventListener("click",function(){

    const p = this.getAttribute("data-permission");

    if(!permissions.includes(p)){
        alert("❌ ACCESS DENIED");
        return;
    }

    if(
        p === "admin_management" ||
        p === "add_admin" ||
        p === "admin_permissions"
    ){

        document
        .getElementById("adminModal")
        .classList.add("show");

        return;
    }

    alert(
        "✅ " +
        this.querySelector(".btn-title").innerText +
        "\n\nBackend connection required for real action."
    );

});

});


/*
SAVE ADMIN
*/

document
.getElementById("saveAdmin")
.addEventListener("click",function(){

    if(!tgUser || String(tgUser.id) !== MAIN_ADMIN_ID){

        alert("❌ Only Main Admin can add admins.");
        return;

    }

    const id =
        document.getElementById("newAdminId")
        .value.trim();

    if(!id){

        alert("❌ Telegram User ID দিন");
        return;

    }

    if(id === MAIN_ADMIN_ID){

        alert("❌ Main Admin already has full access.");
        return;

    }

    const selected = [];

    document
    .querySelectorAll(
        "#adminModal input[type='checkbox']:checked"
    )
    .forEach(function(box){

        selected.push(box.value);

    });

    if(selected.length === 0){

        alert("❌ অন্তত একটি access select করুন");
        return;

    }

    alert(
        "✅ ADMIN READY\n\n" +
        "ID: " + id +
        "\n\nACCESS:\n" +
        selected.join("\n")
    );

});


/*
CLOSE MODAL
*/

document
.getElementById("closeModal")
.addEventListener("click",function(){

    document
    .getElementById("adminModal")
    .classList.remove("show");

});


/*
CLOSE APP
*/

document
.getElementById("backBtn")
.addEventListener("click",function(){

    if(window.Telegram && Telegram.WebApp){

        Telegram.WebApp.close();

    }else{

        history.back();

    }

});

</script>

</body>
    </html>
