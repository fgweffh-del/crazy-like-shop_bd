<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Crazy Like Deposit</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 50% 0%,#8b32d633,transparent 38%),
        #050507;
    color:#fff;
    padding-bottom:95px;
}

.container{
    width:100%;
    max-width:620px;
    margin:auto;
    padding:18px 15px 30px;
}

/* BACK */

.back-btn{
    width:100%;
    height:46px;
    margin-bottom:20px;

    border:1px solid #8b32bd;
    border-radius:14px;

    background:linear-gradient(
        90deg,
        #17101e,
        #25102f
    );

    color:#d99cff;
    font-size:13px;
    font-weight:900;

    box-shadow:0 0 15px #9b32ff44;
}

.back-btn:active{
    transform:scale(.97);
}

/* HEADER */

.header{
    text-align:center;
    margin-bottom:25px;
}

.logo{
    width:78px;
    height:78px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #8b32bd,
            #21102d
        );

    border:2px solid #b65ce0;

    box-shadow:
        0 0 18px #9b32ff,
        0 0 40px #9b32ff44;

    font-size:36px;
}

.title{
    margin-top:11px;

    font-size:24px;
    font-weight:900;

    background:
        linear-gradient(
            90deg,
            #fff,
            #c978ff,
            #ffd45b
        );

    -webkit-background-clip:text;
    color:transparent;
}

.subtitle{
    margin-top:6px;

    color:#918899;
    font-size:10px;
    letter-spacing:1px;
}

/* MAIN */

.deposit-box{
    width:100%;

    padding:20px;

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            #17101e,
            #0b090e
        );

    border:1px solid #422c50;

    box-shadow:
        0 0 25px #8b32d622;
}

.main-title{
    text-align:center;

    color:#d99cff;

    font-size:16px;
    font-weight:900;

    margin-bottom:8px;
}

.main-text{
    text-align:center;

    color:#aaa;

    font-size:11px;

    line-height:1.8;

    margin-bottom:18px;
}

/* ADMIN BUTTON */

.admin-btn{
    width:100%;
    min-height:62px;

    margin-top:13px;

    padding:10px 16px;

    border-radius:16px;

    display:flex;
    align-items:center;

    color:#fff;

    cursor:pointer;

    text-align:left;
}

.admin-btn:active{
    transform:scale(.97);
}

/* WHATSAPP */

.whatsapp{
    border:1px solid #25d366;

    background:
        linear-gradient(
            90deg,
            #082016,
            #0b110e
        );

    box-shadow:
        0 0 18px #25d36644;
}

/* TELEGRAM */

.telegram{
    border:1px solid #229ed9;

    background:
        linear-gradient(
            90deg,
            #071a25,
            #0b1014
        );

    box-shadow:
        0 0 18px #229ed944;
}

/* ICON */

.icon{
    width:45px;

    flex-shrink:0;

    font-size:26px;

    text-align:center;
}

/* TEXT */

.btn-text{
    margin-left:8px;

    font-size:14px;
    font-weight:900;
}

.btn-number{
    display:block;

    margin-top:4px;

    color:#aaa;

    font-size:11px;

    font-weight:normal;
}

/* INFO TEXT */

.info-box{
    margin-top:18px;

    padding:16px;

    border-radius:15px;

    background:#0a080d;

    border:1px solid #51305f;

    color:#aaa;

    font-size:11px;

    line-height:1.8;

    text-align:center;
}

/* NAV */

.bottom-nav{
    position:fixed;

    left:50%;
    bottom:10px;

    transform:translateX(-50%);

    width:calc(100% - 20px);
    max-width:600px;

    height:68px;

    display:flex;
    align-items:center;
    justify-content:space-around;

    background:
        linear-gradient(
            145deg,
            #19111f,
            #09080d
        );

    border:1px solid #3c2948;

    border-radius:22px;

    box-shadow:0 10px 35px #000;

    z-index:999;
}

.nav-btn{
    width:52px;
    height:52px;

    border:0;
    border-radius:17px;

    background:transparent;

    font-size:24px;
}

.nav-btn.active{
    background:#382047;

    border:1px solid #8549a6;

    box-shadow:
        0 0 15px #9b32ff55;
}
</style>
</head>

<body>

<div class="container">

    <!-- BACK -->

    <button
        class="back-btn"
        type="button"
        onclick="location.href='index.html'">

        ← BACK TO HOME

    </button>


    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            💳
        </div>

        <div class="title">
            DEPOSIT
        </div>

        <div class="subtitle">
            ADMIN PAYMENT SUPPORT
        </div>

    </div>


    <!-- DEPOSIT -->

    <div class="deposit-box">

        <div class="main-title">
            💰 DEPOSIT MONEY
        </div>

        <div class="main-text">
            Deposit করতে নিচের যেকোনো Admin-এর
            সাথে যোগাযোগ করুন।
            <br>
            Payment details Admin-এর কাছ থেকে নিন।
        </div>


        <!-- WHATSAPP -->

        <button
            class="admin-btn whatsapp"
            type="button"
            onclick="window.open(
                'https://wa.me/8801846882853',
                '_blank'
            )">

            <span class="icon">
                🟢
            </span>

            <span class="btn-text">

                WHATSAPP ADMIN

                <span class="btn-number">
                    01846882853
                </span>

            </span>

        </button>


        <!-- TELEGRAM NAZIM -->

        <button
            class="admin-btn telegram"
            type="button"
            onclick="window.open(
                'https://t.me/Nazim684',
                '_blank'
            )">

            <span class="icon">
                ✈️
            </span>

            <span class="btn-text">

                TELEGRAM ADMIN

                <span class="btn-number">
                    @Nazim684
                </span>

            </span>

        </button>


        <!-- TELEGRAM A1NX -->

        <button
            class="admin-btn telegram"
            type="button"
            onclick="window.open(
                'https://t.me/a1nx_f',
                '_blank'
            )">

            <span class="icon">
                ✈️
            </span>

            <span class="btn-text">

                TELEGRAM ADMIN

                <span class="btn-number">
                    @a1nx_f
                </span>

            </span>

        </button>


        <!-- INFO -->

        <div class="info-box">

            ℹ️ Deposit করার জন্য উপরের
            WhatsApp অথবা Telegram Admin-এর
            সাথে যোগাযোগ করুন।

            <br><br>

            Payment করার আগে Admin-এর কাছ থেকে
            সঠিক payment details নিয়ে নিন।

        </div>

    </div>

</div>


<!-- BOTTOM NAV -->

<div class="bottom-nav">

    <button
        class="nav-btn"
        onclick="location.href='index.html'">

        🏠

    </button>

    <button
        class="nav-btn"
        onclick="location.href='orders.html'">

        🧾

    </button>

    <button
        class="nav-btn"
        onclick="location.href='shop.html'">

        🛒

    </button>

    <button
        class="nav-btn active"
        onclick="location.href='deposit.html'">

        💳

    </button>

    <button
        class="nav-btn"
        onclick="location.href='account.html'">

        👤

    </button>

</div>


<script>

/* TELEGRAM MINI APP */

if(
    window.Telegram &&
    window.Telegram.WebApp
){

    Telegram.WebApp.ready();

    Telegram.WebApp.expand();

}

</script>

</body>
</html>
