<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Premium Like</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#050507;
    color:#fff;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:620px;
    margin:auto;
    padding:25px 12px 40px;
}

.header{
    text-align:center;
    margin-bottom:22px;
}

.crown{
    font-size:32px;
    filter:drop-shadow(0 0 12px #ffd45b);
}

.title{
    margin-top:5px;
    font-size:23px;
    font-weight:900;
    background:linear-gradient(90deg,#fff,#c66cff,#ffd45b);
    -webkit-background-clip:text;
    color:transparent;
}

.subtitle{
    margin-top:6px;
    color:#81798b;
    font-size:9px;
}

/* PACKAGE */

.package-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.package{
    min-width:0;
    padding:14px 6px;
    text-align:center;

    border-radius:17px;

    background:
        radial-gradient(circle at 50% 0%,#a13cff28,transparent 65%),
        linear-gradient(145deg,#1d1326,#0c0a10);

    border:1px solid #493052;

    box-shadow:
        inset 0 0 15px #9b3cff08,
        0 5px 20px #00000050;

    cursor:pointer;
    transition:.18s;
}

.package:active{
    transform:scale(.92);
}

.package-icon{
    font-size:19px;
}

.like{
    margin-top:6px;
    font-size:11px;
    font-weight:900;
    white-space:nowrap;
}

.amount{
    margin-top:5px;
    color:#ffd45b;
    font-size:12px;
    font-weight:900;
}

.delivery{
    margin-top:5px;
    color:#59e995;
    font-size:8px;
    font-weight:bold;
    white-space:nowrap;
}

.select{
    margin-top:8px;
    padding:5px 3px;
    border-radius:8px;

    background:#9b3cff16;
    border:1px solid #9b3cff30;

    color:#c98aff;
    font-size:7px;
    font-weight:bold;
}

/* ORDER */

.order-box{
    display:none;

    margin-top:18px;
    padding:18px;

    border-radius:20px;

    background:linear-gradient(145deg,#19111f,#0c0a0f);

    border:1px solid #4e3260;
}

.order-title{
    text-align:center;
    font-size:17px;
    font-weight:900;
}

.selected{
    margin-top:12px;
    padding:12px;

    text-align:center;

    border-radius:13px;

    background:#25152f;
    border:1px solid #58376a;

    color:#d29aff;

    font-size:11px;
    font-weight:bold;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;

    color:#8f8795;
    font-size:9px;
}

input{
    width:100%;
    height:48px;

    padding:0 13px;

    border-radius:13px;
    border:1px solid #3b2c44;

    background:#070609;
    color:#fff;
    outline:none;
}

input:focus{
    border-color:#9b3cff;
}

.done{
    width:100%;
    height:48px;

    margin-top:12px;

    border:0;
    border-radius:13px;

    background:linear-gradient(90deg,#7130a5,#a13cff);

    color:#fff;
    font-size:11px;
    font-weight:900;
}

.back{
    width:100%;
    height:44px;

    margin-top:8px;

    border:1px solid #302738;
    border-radius:13px;

    background:#121016;
    color:#aaa;
}

/* PROCESSING */

.processing{
    display:none;

    margin-top:18px;
    padding:22px;

    text-align:center;

    border-radius:20px;

    background:#101611;
    border:1px solid #2b593d;
}

.processing-icon{
    font-size:34px;
}

.processing-title{
    margin-top:7px;
    font-size:16px;
    font-weight:900;
}

.processing-text{
    margin-top:6px;
    color:#7f887f;
    font-size:9px;
    line-height:1.6;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="crown">👑</div>

        <div class="title">
            PREMIUM LIKE
        </div>

        <div class="subtitle">
            Select your package
        </div>

    </div>


    <!-- PACKAGE LIST -->

    <div class="package-grid">

        <div class="package"
             onclick="selectPackage(2000,100,'1 Day')">

            <div class="package-icon">❤️</div>

            <div class="like">
                2K LIKE
            </div>

            <div class="amount">
                ৳100
            </div>

            <div class="delivery">
                ⏱ 1 DAY
            </div>

            <div class="select">
                SELECT
            </div>

        </div>


        <div class="package"
             onclick="selectPackage(5000,200,'2 Day')">

            <div class="package-icon">❤️</div>

            <div class="like">
                5K LIKE
            </div>

            <div class="amount">
                ৳200
            </div>

            <div class="delivery">
                ⏱ 2 DAY
            </div>

            <div class="select">
                SELECT
            </div>

        </div>


        <div class="package"
             onclick="selectPackage(10000,350,'3 Day')">

            <div class="package-icon">❤️</div>

            <div class="like">
                10K LIKE
            </div>

            <div class="amount">
                ৳350
            </div>

            <div class="delivery">
                ⏱ 3 DAY
            </div>

            <div class="select">
                SELECT
            </div>

        </div>

    </div>


    <!-- ORDER -->

    <div class="order-box" id="orderBox">

        <div class="order-title">
            📦 PLACE ORDER
        </div>

        <div class="selected" id="selectedPackage"></div>

        <label>
            ENTER UID
        </label>

        <input
            id="uid"
            type="text"
            inputmode="numeric"
            placeholder="Enter UID"
        >

        <button class="done" onclick="submitOrder()">
            ✓ DONE
        </button>

        <button class="back" onclick="closeOrder()">
            ← BACK
        </button>

    </div>


    <!-- PROCESSING -->

    <div class="processing" id="processing">

        <div class="processing-icon">
            ⏳
        </div>

        <div class="processing-title">
            ORDER PROCESSING
        </div>

        <div class="processing-text">
            Your order has been submitted.
            Please wait for admin verification.
        </div>

    </div>

</div>


<script>

let selectedLike = 0;
let selectedAmount = 0;
let selectedDelivery = "";


function selectPackage(like,amount,delivery){

    selectedLike = like;
    selectedAmount = amount;
    selectedDelivery = delivery;

    document.getElementById("selectedPackage").innerHTML =
        "❤️ " + like.toLocaleString() +
        " LIKE &nbsp; • &nbsp; ৳" + amount +
        " &nbsp; • &nbsp; ⏱ " + delivery;

    document.getElementById("orderBox").style.display="block";

    document.getElementById("processing").style.display="none";

    document.getElementById("uid").value="";

    document.getElementById("orderBox")
        .scrollIntoView({
            behavior:"smooth",
            block:"center"
        });
}


function submitOrder(){

    const uid =
        document.getElementById("uid").value.trim();

    if(uid === ""){
        alert("❌ Please enter UID");
        return;
    }

    if(!/^[0-9]+$/.test(uid)){
        alert("❌ Please enter a valid UID");
        return;
    }

    document.getElementById("orderBox").style.display="none";

    document.getElementById("processing").style.display="block";

}


function closeOrder(){

    document.getElementById("orderBox").style.display="none";

}

</script>

</body>
  </html>
